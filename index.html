<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>专属复古故事书</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  :root {
    --desk-bg: radial-gradient(circle at center, #3a2e26 0%, #1a1512 100%);
    --paper-bg: #ebd6b0;
    --paper-thickness: #cdb187;
    --ink-color: #3e2a1e;
    --ink-light: #7a5d40;
    --btn-bg: rgba(255,255,255,.1);
    --btn-text: #d1c8b8;
    --btn-border: rgba(255,255,255,.2);
  }

  body.dark-mode {
    --desk-bg: radial-gradient(circle at center, #111 0%, #000 100%);
    --paper-bg: #2a241d;
    --paper-thickness: #1f1a14;
    --ink-color: #a89582;
    --ink-light: #7a6959;
    --btn-bg: rgba(255,255,255,.05);
    --btn-text: #888;
  }

  body {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
    background: var(--desk-bg); 
    height: 100vh; overflow: hidden;
    color: var(--ink-color);
    transition: background 0.5s;
    user-select: none;
  }

  /* 顶部按钮 */
  .theme-btn, .back-btn, .music-btn {
    position: fixed; top: max(12px, env(safe-area-inset-top)); z-index: 100;
    font-family: inherit; font-size: .9rem; border-radius: 50px;
    border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-text);
    cursor: pointer; backdrop-filter: blur(8px); transition: .3s;
  }
  .theme-btn { right: 16px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .music-btn { right: 70px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .back-btn { left: 16px; padding: .5rem 1.2rem; }
  .hidden { display: none !important; }

  /* 视图切换 */
  .view { 
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; 
    transition: opacity .4s, transform .4s; 
  }
  .view.hidden { opacity: 0; pointer-events: none; transform: translateX(-30px); }

  /* 首页左右滑动 */
  .home-scroll-container {
    width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden; 
    display: flex; align-items: center; padding: 0 10vw;
    scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none;
  }
  .home-scroll-container::-webkit-scrollbar { display: none; }
  .slide-wrap { display: flex; flex-direction: row; gap: 2.5rem; align-items: center; width: max-content; padding: 20px; }
  .series-card {
    display: flex; flex-direction: column; align-items: center; gap: 15px;
    flex-shrink: 0; cursor: pointer; opacity: 0; transform: translateX(100px); animation: slideIn .5s forwards;
  }
  .circle {
    width: clamp(120px, 18vw, 180px); height: clamp(120px, 18vw, 180px); border-radius: 50%;
    overflow: hidden; border: 4px solid var(--paper-bg); box-shadow: 0 15px 35px rgba(0,0,0,.6); position: relative; transition: transform 0.3s;
  }
  .circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .series-card:hover .circle { transform: scale(1.05); }
  .series-name { font-size: 1.2rem; color: var(--btn-text); letter-spacing: 2px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); white-space: nowrap; }
  @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }

  /* 目录页 */
  .story-list { display: flex; flex-direction: column; gap: 1.2rem; width: min(85vw, 400px); max-height: 80vh; overflow-y: auto; padding: 10px; }
  .story-list::-webkit-scrollbar { display: none; }
  .story-list { -ms-overflow-style: none; scrollbar-width: none; }
  .story-item {
    font-size: 1.2rem; padding: 1rem 1.5rem; border-radius: 8px; background: var(--paper-bg);
    border: 1px solid rgba(0,0,0,0.2); cursor: pointer; opacity: 0; transform: translateX(100px);
    animation: slideIn .4s forwards; color: var(--ink-color); box-shadow: 0 5px 15px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 8px;
  }
  .story-item::before { content: "›"; font-size: 1.5rem; color: var(--ink-light); line-height: 1; margin-top: -3px;}

  /* 书本样式 */
  #reader { perspective: 2500px; justify-content: center; }
  .book { 
    position: relative; width: min(90vw, 1000px); height: min(80vh, 750px); 
    display: flex; transform-style: preserve-3d; filter: drop-shadow(0 30px 40px rgba(0,0,0,0.8)); 
  }
  .book::before, .book::after {
    content: ""; position: absolute; top: 6px; height: 100%; width: 50%; z-index: -1;
    background-color: var(--paper-thickness);
    background-image: repeating-linear-gradient(to bottom, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, rgba(255,255,255,0.05) 1px, rgba(255,255,255,0.05) 3px);
    border-radius: 3px;
  }
  .book::before { left: -6px; box-shadow: -1px 1px 0 var(--paper-thickness), -2px 2px 0 var(--paper-thickness), -3px 3px 0 var(--paper-thickness), -4px 4px 0 var(--paper-thickness), -5px 5px 0 var(--paper-thickness), -6px 6px 0 var(--paper-thickness), -10px 10px 20px rgba(0,0,0,0.5); }
  .book::after { right: -6px; box-shadow: 1px 1px 0 var(--paper-thickness), 2px 2px 0 var(--paper-thickness), 3px 3px 0 var(--paper-thickness), 4px 4px 0 var(--paper-thickness), 5px 5px 0 var(--paper-thickness), 6px 6px 0 var(--paper-thickness), 10px 10px 20px rgba(0,0,0,0.5); }

  .page {
    width: 50%; height: 100%; position: relative; background-color: var(--paper-bg);
    background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.08"/></svg>');
    overflow: hidden; backface-visibility: hidden; box-shadow: inset 0 0 40px rgba(100, 70, 40, 0.2);
  }
  .page-left  { border-radius: 10px 0 0 10px; }
  .page-right { border-radius: 0 10px 10px 0; }
  .page-left::after { content: ""; position: absolute; right: 0; top: 0; width: 60px; height: 100%; background: linear-gradient(to left, rgba(20, 10, 5, 0.6), transparent); pointer-events: none; z-index: 5; }
  .page-right::after { content: ""; position: absolute; left: 0; top: 0; width: 60px; height: 100%; background: linear-gradient(to right, rgba(20, 10, 5, 0.6), transparent); pointer-events: none; z-index: 5; }

  /* 左侧图片 */
  .carousel { position: relative; width: 100%; height: 100%; z-index: 1; background: var(--ink-light); }
  .carousel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2s ease-in-out; }
  .carousel img.active { opacity: 1; }
  .dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 8; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.4); cursor: pointer; transition: .3s; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .dots span.on { background: #fff; transform: scale(1.3); }

  /* 右侧文字（上下滑动） */
  .page-right .content { 
    padding: 50px 40px; height: 100%; display: flex; flex-direction: column; position: relative; z-index: 6; 
    overflow-y: auto; scroll-behavior: smooth;
  }
  .page-right .content::-webkit-scrollbar { width: 4px; }
  .page-right .content::-webkit-scrollbar-thumb { background: rgba(122, 93, 64, 0.3); border-radius: 2px; }
  
  .page-right h2 { font-size: 1.6rem; font-weight: normal; color: var(--ink-color); letter-spacing: 3px; text-align: center; margin-bottom: 20px; border-bottom: 1px dashed rgba(138,123,108,0.3); padding-bottom: 15px; flex-shrink: 0; }
  .page-right p { font-size: 1.15rem; line-height: 2.4; color: var(--ink-color); text-align: justify; text-shadow: 0 0 1px rgba(62, 42, 30, 0.3); white-space: pre-wrap; }

  /* 作者手记 */
  .author-note-box {
    margin-top: 40px; border: 1px dashed var(--ink-light); border-radius: 6px; padding: 12px 15px; width: 100%; text-align: center;
    background: rgba(0,0,0,0.03); box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); position: relative;
    min-height: 75px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .author-note-box::before {
    content: "作者手记"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: var(--paper-bg); padding: 0 8px; font-size: 0.75rem; color: var(--ink-light); letter-spacing: 1px;
  }
  .author-note-text { font-size: 0.9rem; color: var(--ink-light); transition: opacity 0.6s ease-in-out; min-height: 1.5em; display: inline-block; line-height: 1.5; }

  /* 3D翻书特效纸 */
  .flip-page {
    position: absolute; top: 0; right: 0; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d;
    pointer-events: none; z-index: 20; transition: transform .8s ease-in-out; background-color: var(--paper-bg);
    background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.08"/></svg>');
    border-radius: 0 10px 10px 0; box-shadow: -15px 0 30px rgba(0,0,0,.2), inset 15px 0 20px rgba(0,0,0,.1); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--ink-light);
  }
  .flip-page.forward { transform: rotateY(-180deg); box-shadow: 15px 0 30px rgba(0,0,0,.2), inset -15px 0 20px rgba(0,0,0,.1); }

  /* 底部按钮 */
  .nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; align-items: center; z-index: 50; }
  .nav button {
    font-family: inherit; font-size: .95rem; padding: .6rem 1.8rem; border-radius: 50px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-text); cursor: pointer; transition: .3s; backdrop-filter: blur(5px);
  }
  .nav button:hover { background: rgba(255,255,255,.2); }
  .nav button:disabled { opacity: .3; cursor: not-allowed; }

  /* 弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; transition: .3s; }
  .modal-mask.show { opacity: 1; pointer-events: auto; }
  .modal { background: var(--paper-bg); color: var(--ink-color); padding: 2.5rem 3rem; border-radius: 12px; text-align: center; transform: scale(.95); transition: .3s; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  .modal-mask.show .modal { transform: scale(1); }
  .modal h3 { font-weight: normal; font-size: 1.5rem; margin-bottom: 10px; }
  .modal button { padding: .6rem 2rem; border-radius: 50px; border: 1px solid var(--btn-border); background: var(--ink-color); color: var(--paper-bg); cursor: pointer; transition: .3s; font-family: inherit; }

  /* 新手导引 */
  .guide-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  .guide-mask.show { opacity: 1; pointer-events: auto; }
  .guide-box { background: var(--paper-bg); padding: 30px 40px; border-radius: 12px; text-align: center; color: var(--ink-color); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.8); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .guide-box h3 { font-size: 1.4rem; margin-bottom: 15px; font-weight: normal; }
  .guide-box p { font-size: 1rem; color: var(--ink-light); line-height: 1.8; margin-bottom: 20px; }
  .guide-box button { background: var(--ink-color); color: var(--paper-bg); border: none; padding: 10px 30px; border-radius: 20px; font-size: 1rem; cursor: pointer; font-family: inherit; transition: 0.3s; }

  /* 手机端适配 */
  @media (max-width: 768px) and (orientation: portrait) {
    .book { height: 82vh; width: 86vw; margin-left: 10vw; display: block; border-radius: 8px; }
    .book::before, .book::after { display: none; } 
    .page { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 4px 8px 8px 4px; box-shadow: -10px 10px 30px rgba(0,0,0,0.8); }
    .page::after { content: ""; position: absolute; left: 0; top: 0; width: 20px; height: 100%; background: linear-gradient(to right, rgba(20, 10, 5, 0.8), transparent); pointer-events: none; z-index: 5; }
    
    /* 手机端图片占位在上，文字在下 */
    .page.page-left { height: 35%; border-radius: 4px 8px 0 0; z-index: 6; }
    .page.page-right { top: 35%; height: 65%; border-radius: 0 0 8px 4px; }
    .page-left::after { display: none; }
    .page-right::after { display: none; }
    
    .page-right .content { padding: 25px 20px; }
    .page-right h2 { font-size: 1.4rem; margin-bottom: 15px; padding-bottom: 10px;}
    .page-right p { font-size: 1.05rem; line-height: 2; }
    
    /* 隐藏手机端的3D纸 */
    .flip-page { display: none !important; }

    /* 手机端切换故事用淡入淡出 */
    .page-right .content.anim-next { animation: mobileInNext .4s ease-out forwards; }
    .page-right .content.anim-prev { animation: mobileInPrev .4s ease-out forwards; }
    @keyframes mobileInNext { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes mobileInPrev { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    
    .home-scroll-container { padding: 0 5vw; }
    .slide-wrap { gap: 1.5rem; }
  }
</style>
</head>
<body>

<button class="music-btn" id="musicBtn" title="播放/暂停音乐">🎵</button>
<button class="theme-btn" id="themeBtn" title="切换明暗">🌙</button>
<button class="back-btn hidden" id="backBtn">← 返回</button>

<div class="view" id="homeView">
  <div class="home-scroll-container" id="homeScroll">
    <div class="slide-wrap" id="seriesWrap"></div>
  </div>
</div>

<div class="view hidden" id="seriesView"><div class="story-list" id="storyListWrap"></div></div>

<!-- 阅读页 -->
<div class="view hidden" id="reader">

    <!-- 左页（电脑端大图，手机端顶图） -->
    <div class="page page-left">

        content: `银剑的冷光还残留在指尖，艾斯曾是王国最锋利的猎魔人。

他生于永夜横行的时代，古堡里的吸血鬼成群肆虐，阴影爬满城镇街巷，百姓在恐惧里苟延残喘，整个国家动荡不安。他奉命入宫护驾，第一次见到她——世人都称她公主。

不要记挂我，若日后看见朝阳，就当，是我最后一次拥抱你。—艾斯`,
                authorNote: [

"https://imgbed.heliar.top/i/rnA8FJ8A0BVxi5wP_IMG_2734.jpg"], content: `崖风如刃，割裂云海，刮得整座山巅都在轰鸣震颤。

万丈深渊之下，黑雾翻涌不息，死寂幽暗，足以吞尽人间所有情爱与温柔。

今日，是他沈司，终局登顶的日子。

数年筹谋，步步嗜血，机关算尽，血染满途。他踩着尸山血海走来，斩断羁绊，舍弃温情，亲手铺就了一条通往至尊权位的帝王路。

而她，是他这场滔天霸业里，唯一被精心饲养、假意偏爱、全程演戏的牺牲品。

从初见那一刻起，没有心动，没有破例，没有半分情不自禁。

他看她的眼神，从来不是爱慕，而是打量、权衡、利用。

他知她心性纯粹，知她用情至深，知她最易心软，便精准拿捏她所有软肋。

他演温柔，演深情，演许诺，演偏爱。

雨夜撑伞、寒夜温茶、危难护她、月下盟誓。

岁岁年年，朝夕温存，全是刻意伪装，全是帝王权术，全是虚假牢笼。

他需要她独一无二的血脉破局，需要她的存在成就万世基业。

于他而言——
她不是心上人，只是工具。
不是余生，只是祭品。

可她一无所知。

她捧着一腔滚烫赤诚，飞蛾扑火般沉溺在他编织的温柔骗局里。她把他当作乱世唯一救赎，当作此生归宿。她毫无保留、倾尽所有，将真心、信任、温柔、余生，全数奉上。

她爱得卑微、热烈、坦荡、纯粹。

她以为双向奔赴，殊不知，从头到尾，只是她一人的情深意重，换来他冷眼旁观的步步收割。

如今大局落定，江山在手，权倾天下。

他不需要演戏了。

山巅狂风肆虐，他立于崖前，墨袍猎猎，眉眼冷硬如千年寒玉，没有一丝温度，没有半分旧情。

他看着眼前泪流满面、满心依赖他的姑娘，语调平淡，凉薄刺骨，字字如刀凌迟人心：

“演够了，也累了。”

“这场戏，该结束了。”

她身子猛地一僵，血液瞬间冻结，指尖剧烈颤抖，难以置信地望着他。

他眼神淡漠，毫无波澜，甚至带着一丝居高临下的漠然与嘲弄：
“你当真以为，我会爱你？”
“我护你、哄你、陪你、纵容你，从来只为利用你的血脉，成就我的江山。”
“你所珍视的一切温柔，不过是我为达目的，施舍的假象。”

每一个字，都冷得不带一丝人气。

她喉咙发紧，心口剧痛如裂，眼泪瞬间崩决，顺着苍白脸颊疯狂滚落。

她踉跄后退，声音破碎嘶哑，带着最后一丝卑微到极致的奢望：
“那……那些深夜相伴？那些危难相护？那些岁岁诺言？……全部都是假的吗？”

“全假。”

他答得干脆利落，毫无迟疑，眼底没有一丝一毫动摇。

数年朝夕相处，她的温柔、她的赤诚、她的偏爱，在他此刻冰冷的心智里，通通不值一提。霸业在前，情爱最是廉价无用。

她泣不成声，浑身颤抖：
“你哪怕……有一瞬间心动过我？哪怕一瞬？”

他垂眸，俯视她崩溃落泪的模样，薄唇吐出最残忍、最诛心的判决：

“从未。”
“从头到尾，你于我，无用时可弃，有用时可留。仅此而已。”

这句话，彻底碾碎了她最后一丝念想。

她凄然笑起，笑声凄厉破碎，混在呼啸山风里，悲凉得让人窒息：
“原来如此……原来我数年情深，满腔真心，不过是你登顶路上，一场廉价又可笑的消遣。”

“沈司。”
“我不恨你野心滔天，不恨你谋夺天下。”

她抬起泪眼，死死看着眼前这个她爱到骨血里的男人，字字泣血，痛彻骨髓：
“可我恨你骗我！”
“你要权要势，大可直言掠夺，我甘愿赴死！”
“可你为什么要骗我真心？！”
“你亲手给我温柔，亲手许我余生，亲手让我沦陷沉沦！”
“等我倾尽所有、爱到无可救药，你再亲手告诉我——一切皆是骗局！”
“沈司，你何其凉薄，何其残忍！”

面对她撕心裂肺的控诉，他神色依旧冰冷僵硬，心如磐石，不为所动。

他语气冷漠，带着帝王无情的绝对理智：
“乱世成王，本就无情。情爱累赘，本就该弃。”
“是你太蠢，信了不该信的温柔。”

蠢。

一字落地，彻底压垮了她最后的脊梁。

是啊，是她太蠢。

蠢到把一场精心算计的骗局，当成此生唯一的深情。

眼底最后一点光亮，彻底熄灭。

爱意死了，执念死了，心彻底死了。

世间再无半分值得她留恋。

她缓缓后退，一步步退至崖边，身后是万丈深渊，身前是负她彻骨的爱人。

风扬起她散乱的发丝，泪痕斑驳，脸色惨白。

她望着他，再无爱意，再无不甘，只剩一片死寂的荒芜：

“既然我真心廉价，既然我余生累赘。”
“那我归还你所有算计，成全你的万里霸业。”
“从今往后，你君临天下，千秋万代。”
“我坠渊寂灭，从此人间，再无牵绊。”

话音落。
她闭眼，身躯轻轻一仰。

决然、利落、毫无留恋。

像一片凋零碎雪，纵身坠入无尽黑雾深渊。

刹那之间，天地骤停。

狂风骤停，风声死寂。

沈司整个人如遭雷击，浑身僵硬在原地。

前一秒还冷硬如铁、理智至上、毫无波澜的心脏，骤然炸裂。

所有的冷漠、算计、无情、帝王心智，在她坠落的那一瞬间，尽数崩塌、碎成齑粉。

他一直以为自己在演戏。

他以为自己掌控全局，心如止水，从不动情。

可原来——

他演了数年无情，却早已在无数个温柔朝夕里，悄悄爱她入髓，深入骨血，刻入神魂。

只是他野心蒙心，权欲蔽眼，亲手压制、亲手否认、亲手掩埋。

直到这一刻，她没了。

永远没了。

那个满眼是他、疼他信他、为他倾尽所有的姑娘，被他亲手一句句诛心话语，逼死在了他登顶的这一天。

极致的恐慌、悔恨、窒息、剧痛，瞬间席卷五脏六腑，撕裂四肢百骸。

他瞳孔猩红，指尖剧烈颤抖，浑身冰冷，呼吸剧痛到几乎昏厥。

可多年冷酷成性的本能，让他嘴硬到极致，喉咙艰涩挤出一句违心至极、冰冷至极的妄语：

“……死了，也好。”

这句话刚落。

滚烫泪水，瞬间砸落。

他疯了。

彻底疯魔。

好什么好！

一点都不好！

他赢了天下，赢了权柄，赢了世人仰望的至尊王座。

可他输掉了这辈子唯一爱过、唯一暖过他荒芜人生的人。

万里江山，千秋霸业，无上权位——

瞬间变得肮脏、空洞、一文不值。

他不要天下了。

他只要她活过来。

只要那个温柔唤他、满心向他、真心待他的姑娘，再看他一眼。

巨大的悔恨将他彻底吞噬，方才高高在上的帝王，瞬间溃不成军，狼狈不堪。

他喉间溢出破碎嘶哑的呜咽，眼底是濒临疯狂的赤红。

他算尽人心，算尽天机，算尽天下棋局。

唯独算错了自己。

算错了，他早已经爱她胜过江山，胜过霸业，胜过苍生万物。
 
狂风再度呼啸而起。
 
他再也没有半分迟疑，抛弃万里河山，舍弃至尊王座，撕碎一身帝王冷骨。
 
一步踏出，纵身跃下万丈深渊。
 
下坠的风声里，是他撕心裂肺、泣血追悔的疯魔低语：

命运连同赴黄泉的慈悲，都不肯施舍给他们。

又或许这是命运，给沈司最大的惩罚。

沈司并未随她一同归于尘土。
 
崖底乱石挂住他的衣袍，他苟活下来，一身伤痕，却求死不能。

朝堂百官俯首，四海疆域归降，史书将书写他盖世功绩，后世会称颂他平定乱世的赫赫威名。

梦里永远是崖边那一幕，是她泪流满面绝望破碎的眉眼，是她纵身一跃时，那道决绝坠落的身影。
 
他坐拥锦绣山河，宫殿万千，却寻不到一缕属于她的气息。
 
他算尽世间万千人，利用真情，编织骗局，机关算尽夺得天下，到头来，只落得一身永不能消解的罪孽。
 
他报得了家国仇，得了世间权，却赎不完对她欠下的情。

活着，才是对他最残酷的刑罚。
 
岁岁山河更迭，年年月圆月缺。
 
往后漫长的岁岁千秋，他将独自守着这片他用她的真心换来的万里江山。
 
权柄在握，孤冢在心。
 
世间再无阿晚，再无那个会待他以赤诚温柔的姑娘。

却输给了自己的野心，输给了迟来的爱意。

"https://imgbed.heliar.top/i/Gz62kokj3WaQ-Yu0_%E6%88%AA%E5%B1%8F%202026-11-19%2015.37.50.png","https://imgbed.heliar.top/i/_cioAWRGSta88ros_%E6%88%AA%E5%B1%8F%202026-11-19%2015.30.21.png","https://imgbed.heliar.top/i/fjCPNG68z6agj-5i_%E6%88%AA%E5%B1%8F%202026-11-19%2015.29.09.png","https://imgbed.heliar.top/i/5xI2jrFZmW_UNCZo_%E6%88%AA%E5%B1%8F%202026-11-19%2015.31.01.png"], content: `他们成婚这天，是这座城市最后一个白昼。
 
礼堂灯火温柔，红绸轻垂，白纱曳地。
苏晚站在满目璀璨里，眼底盛着滚烫的爱意，望着她的新郎。
 
沈司一身利落黑西装，眉眼温润，温柔得足以倾覆余生所有岁月。
他伸手轻轻扣住她微凉的指尖，嗓音郑重而缱绻：
“晚晚，今日娶你。此生护你平安，予你余生无忧，我说到做到。
 
苏晚眼眶微热，轻轻回握：“沈司，我嫁你，生生世世，不离不弃。”
 
神圣的誓词还未落尽，人间骤然倾覆。

窗外晴空炸裂，凄厉的嘶吼贯穿街巷，末日毫无征兆降临。
未知丧尸病毒瞬间席卷全城，繁华闹市顷刻沦陷。
惨叫声、崩塌声、异化怪物的嘶吼铺天盖地，不绝于耳。
温暖的婚礼殿堂，转瞬沦为人间炼狱的一隅。
 
宾客四散奔逃，慌乱踩踏，鲜活的生命在片刻之间，沦为没有意识的行尸走肉。
 
满城死寂，遍地荒芜。
 
密密麻麻的失控尸潮冲破围墙，狰狞嘶吼着朝礼堂扑来。
所有杀机，直直对准了手无寸铁、身着白纱的苏晚。
 
她吓得浑身僵硬，指尖冰凉，下意识缩在原地，连呼吸都在颤抖。

前路是漫天嗜血怪物，身后是无路可退的绝境。
 
那一刻，沈司没有一秒犹豫。
 
他猛地转身，将颤抖的少女死死、死死护在身后。宽厚的脊背，替她扛住了整个崩塌的人间。
 
“晚晚，别怕。”
 
他声音依旧温柔，稳得让人心疼，像是还在兑现婚礼的誓言。
 
没有武器，没有退路，数以百计的利爪獠牙狠狠撕裂他的西装，啃咬他的皮肉。
滚烫的血瞬间浸透整洁的西装，密密麻麻的伤口狰狞可怖。
 
无解的丧尸病毒，顺着伤口疯狂侵蚀血脉，蚀骨剧痛席卷全身，灼烧他的意识、碾碎他的人性。
 
苏晚埋在他怀里。
看着他孤身挡下所有致命伤害。
看着他脊背血肉模糊。
哭得近乎窒息：
“沈司！放开我！”
＂你会被感染的＂
＂我们一起跑好不好！”
 
他脊背紧绷，痛到身躯微颤，却半步不退。
 
“跑不了了。”
他气息渐乱，体温飞速变冷，意识开始溃散，却用尽最后一丝力气轻声哄她：
“我没关系……我会保护你的……。”
 
末世定律，残酷公平。
但凡沾染病毒者，必失心智，化身为凶，嗜血无度，泯灭所有人情过往，沦为彻头彻尾的怪物。
 
所有人都是如此。
 
唯独沈司，硬生生打破了宿命。
 
极致的深爱凝成枷锁，死死锁住了他体内所有暴戾兽性。
 
病毒蚕食他的肉身，异化他的骨骼，夺走他的体温、他的人间、他做人的所有资格。
他成了半人半尸的异类，不老不死，不生不灭，永世沉沦黑暗，永世被困在这无人救赎的末世。
 
可他唯独没有丢掉——爱她的本能。
 
曾经温润干净的眼眸，大半被幽暗黑雾吞噬，只剩下一隅微光，只为苏晚而亮。
精致的西服彻底碎裂破败，满身血污，满身伤痕。
他再也没有人类的温度，指尖常年冰寒刺骨，心跳不再温热，呼吸不再滚烫。
 
他成了幸存者恐惧、唾弃、避之不及的丧尸怪物。
 
却依旧是那个会弯腰为她挡风、抬手为她斩险、穷尽一切护她周全的沈司。
 
末世荒芜，众生皆恶，尸潮横行，人间再无善意。
唯独这只坠入黑暗的异化丧尸，是整片废土唯一的温柔与神明。
 
他靠着极致的意志力，压制噬血本能，远离所有活人，独自承受无尽孤独、无尽反噬、无尽非人煎熬。
 
满城凶险，遍地杀机。
他寸步不离守在她的身侧。
所有扑向她的丧尸，他徒手斩杀；所有落在她身上的风雨，他尽数遮挡。
幸存者畏惧他的异化模样，骂他非人非鬼，弃他、惧他、唾弃他。
 
只有苏晚，从未退缩。
 
她不惧他冰冷的肌肤，不惧他幽暗的眼眸，不惧末世颠沛，不惧世人非议。
人人弃城逃亡，惜命自保。
唯有她，始终一袭洁白婚纱，留在死寂空城，陪着早已不是人类的爱人。
 

人间皆荒芜，唯你是纯白。
我自愿沉沦，护你度余生。
 
这是末世最狠、也最干净的爱：
全世界我都可以屠戮殆尽，所有生灵我皆可舍弃。
唯独你，
此生——舍不得伤你分毫。

而在这片时空之外，元宇宙的虚化边界悄然映着一道身影。
 
那是个背对世界的神秘人，黑色西装被虚无的冷光勾勒出锋利轮廓。
 
无人知晓他何时出现。
 
直到那道背影缓缓侧过脸来，露出一张清冷淡漠的男性面容，眼底光芒微微一闪。

顾衍之抱着她从宴会厅走回来，黑色西装外套还带着室外微凉的晚风。怀中人安安静静地靠在他臂弯，一身黑色丝绒长裙缀满珍珠链条，随着他迈步的动作，细碎的珍珠轻轻碰撞，发出几乎听不见的轻响。

她喝多了。

方才在晚宴上，她笑着一杯接一杯，眼底盛着朦胧的光，此刻醉意彻底席卷上来，沉沉睡了过去。长睫垂落，盖住往日灵动的眼眸，唇瓣还带着一点酒后的浅红，皮肤白得近乎通透，整个人软成一捧温软的云，毫无防备地倚在他怀里。

顾衍之的手臂稳稳托住她的膝弯与后背，指腹不经意擦过丝绒面料，触感柔滑厚重。他低头，额头轻轻抵了抵她的发顶，视线落在她安静的睡颜上，平日里冷冽锐利的眉眼，此刻尽数化作温柔。他放轻脚步，生怕稍大一点的动静，就惊扰了这场醉酒的安眠。

他慢慢屈膝半蹲，小心地将她放在自己膝头。她身子微微后仰，无意识地侧了侧脸，垂落的手还松松捏着一支晚宴上拿到的红玫瑰，暗红花瓣挨着她微凉的指尖。珍珠颈链顺着颈窝滑落，流苏坠子轻轻贴在锁骨。

顾衍之抬手，指尖轻轻拂开散落在她脸颊旁的发丝。他拈起那支红玫瑰，小心翼翼放在她的肩窝，目光一寸寸描摹她沉睡的轮廓。没有恐慌，没有绝望，只有一种安静绵长的怜惜。

他微微俯身，一只手护在她腰后，另一只手虚虚托着她的肩，看着她毫无力气向后轻仰的模样。玫瑰垂在她手边，暗红与黑丝绒交织，珍珠链条在柔光下泛着细碎莹润的光泽。

她睡得很沉，呼吸轻浅均匀，全然放下了所有防备。

顾衍之就这么静静坐着，抱着膝头醉酒熟睡的人。周遭世界喧嚣远去，偌大空间里，只剩下她平稳的呼吸，和他眼底藏不住的缱绻。他轻轻收紧手臂，将她抱得更稳一点，低声呢喃，轻得像一阵风：

我陪着你。`} ,

“姐姐看。”他嗓音低哑缱绻，带着浓浓的醋味，极尽勾引，“我把自己打包成专属礼物，只送给姐姐一个人。”

他摆在身侧、与自己容貌气质全然一致的人偶，凭空消失了。
 
数十年来，这人偶与他精气同源、五感互通。平日里它静默伫立，唯有麢注入魂力时，才会拥有鲜活的意识与敏捷身姿，一举一动皆随他心念而动。更甚，他与人偶共享视听触感，人偶所见即是他所见，人偶所感即是他所感，就连专属的催眠意念术，也需二人共鸣方可施展。那透支气运、一月仅限六次的禁忌能力，是他藏在骨血里最危险的底牌。
 
可此刻，链接骤然断裂。

麢垂着眼，他能清晰感知到，人偶并未损毁，只是脱离了他的魂力范围，被一个温热、鲜活的生人触碰拾起。

从你指尖触碰到人偶肌肤的那一刻起，断裂的丝线悄然重连。
 
远在空荡灰白房间里的麢，骤然睁眼。
 
陌生的光影闯入他的视野，温柔的室内灯光、你清澈温柔的眉眼……
是人偶的视线，完整复刻在了他的脑海中。他听见了你的赞叹，感受到了你指尖的温度。

人偶依旧维持着静止的姿态，一动不动，骗过了懵懂的你。
无人知晓，这看似可爱的玩偶背后，藏着一个遥远的操控者，正透过它的双眼，静静窥视着你的一切。

麢静坐于黑暗中，他本可以立刻催动魂力，召回人偶。可当他透过人偶，看着你温柔打量玩偶、眼底盛满纯粹欢喜的模样，那颗常年冰封的心，第一次泛起了细微的涟漪。

他压下了召回人偶的念头。

只要他愿意，随时可以启动催眠之术。

他可以隔着千里距离，与人偶建立专属共鸣，双重意念叠加，无声无息催眠眼前的你。可以像操控人偶一般，桎梏你的言行、限制你的行动、左右你的思绪，让你的一切皆由自己掌控。

一月六次的气运限制，是悬在他头顶的枷锁，也是独属于他的绝对权柄。

夜色渐深，书桌前的你还在温柔地望着人偶浅笑。

房间里，麢抬眼，眼底是极致的冷漠与偏执

他选择了蛰伏。

任由人偶留在你身边，以一具玩具摆件的模样，陪伴在你身侧。他隐匿在黑暗之后，借人偶之眼，日夜窥探着你的生活。他不动用催眠，不强行干预，却牢牢握着可以随时掌控你一切的底牌。

一人一偶，一明一暗。

你不知自己从拾起人偶的那一刻起，你的一颦一笑、一举一动，早已尽数落入麢的眼底，沦为他掌心中，随时可被掌控的猎物。

远在孤室的麢，脑海里猛地炸开一阵尖锐的共鸣。人偶的五感被骤然刺激，那一丝贴近、一丝冒犯，顺着精气连线直直扎进他的神经。
他共感了那触觉
他沉默两秒，薄唇轻启，无声动用了禁忌之力。

—【催眠，启动。】

这是他本月第一次开启意念共鸣。

一月仅限六次的禁忌，每一次使用，都在耗他的运。

可他毫不在意。

下一秒，千里之隔的两端，脑电波瞬间重叠共振。

书桌前的你动作骤然僵住。
瞳孔微微涣散，脑海里突然涌入一股冰冷、庞大、不属于自己的意念。

像有第二颗灵魂强行挤进你的意识海域。

房间里的风明明轻柔，你却莫名背脊发寒，四肢变得沉重僵硬，身体不再完全听从自己控制。

你能模糊感觉到——

有人在遥远的暗处，看着你、锁住你、读你的思绪。

人偶依旧安静坐在桌前，一动不动。

可只有麢知道，此刻人偶的意识彻底苏醒，与人偶双眼对视的你，已经落入双重意念的牢笼。

麢通过人偶的视线，俯瞰你涣散的神情，声音直接响彻在你的脑海深处，低沉、清冷、带着不容反抗的掌控欲：

“别动。”

短短两个字。

你全身肌肉瞬间彻底锁死，连指尖都无法颤动分毫。

你惊骇地想要眨眼、想要后退、想要挣脱，意识清醒无比，却彻底丧失了身体主动权。

你终于明白——

这不是普通玩偶。

你捡到的，是连接着深渊的枷锁。

暗处的麢，以人偶为媒介，双重意念层层碾压，开始无声操控你的感官、你的行为、你的情绪。

他轻轻一念，你原本慌乱的心绪瞬间被强行抚平，恐惧被剥离，只剩下空洞的顺从。

他再一念，你僵硬的身体缓缓垂下抬手的动作，姿态温柔得仿佛自愿为之。

像操控人偶一样，操控了活生生的你。

你的意识悬浮在身体里，像被困在傀儡躯壳中的旁观者，眼睁睁看着自己被远方的陌生人支配。

那种诡异、冰冷、极致臣服的掌控感，让你浑身发冷。

而代价另一端，孤室中的麢微微俯身，指尖抵住眉心，呼吸微促。

六次机会，一次已空

他透过人偶的眼睛，静静看着呆滞温顺的你，唇角极淡地勾起一抹的弧度。

催眠效果持续整整三分钟。

三分钟后，意念枷锁骤然解除。

你猛地回神，身体骤然恢复掌控，双腿一软跌坐在椅子上，冷汗浸透脊背，心脏狂跳不止。

可你记不清具体过程，只残留深入骨髓的寒意——

刚刚有个人，短暂地、彻底地、掌控过你的一切。

而书桌前的人偶，依旧安静、清冷、无害。

仿佛从未发生。

远在彼岸的麢缓缓抬眼，望着重新归于平静的连线。

他知道。

游戏，才刚刚开始。

他还有五次机会。

足够——

彻底驯服你的灵魂

第一次催眠过后，整整三日，风平浪静。

你再也不敢随意触碰那人偶。

每次抬眼对上那双通透的眼眸，你心底都会窜起刺骨的寒意。

那三分钟被彻底掌控身体的空白、灵魂悬空的窒息感，没有具体记忆，却刻进了本能的恐惧里。

你隐隐意识到：这尊人偶在“看”你。

而远在灰白空室的廳，始终没有切断连接。

他日日借人偶之眼，凝视你的一举一动，看着你克制、警惕、惴惴不安的模样，心底的偏执愈发蔓延。

他第一次催眠只是试探，耗去一次气运，只为告诉你——你不属于你自己。

第四日深夜，你下定决心，想要将人偶装箱封存。

你伸手握住人偶的肩头，指尖刚触到微凉的衬衫布料，那根横跨两地的精气羁绊线，骤然剧烈震颤。

麢的意识瞬间被刺痛。

他不允许被丢弃。

绝不允许。

【第二次催眠，启动。】

一月六次，已耗其二。

同一秒，你的大脑轰然一震。

房间里的灯光没变，可你的世界瞬间蒙上一层别人的阴影。

这次的操控，比上次更霸道、更细致。

不再只是简单禁锢动作。

麢透过人偶的共呜，开始入侵你的思绪。

冰冷的意念压着你的潜意识，强行篡改你的想法——
【不可丢弃它。】
【你喜欢它。】
【你离不开它。】

你的大脑被两股力量撕扯。

一股来自遥远未知的操控者，强势、冰冷、不容抗拒；
一股来自你自己本能的抗拒、恐惧、清醒。

剧痛瞬间炸开。

你的意识没有被彻底碾压湮灭，反而在极致的压迫里，骤然滋生出尖锐的反抗力。

别人在抢你的身体、读你的思绪、篡改你的本心。

外表冷漠孤疏，心性悲悯温柔，独行万古，默默承载众生遗憾。

万千位面的生离死别，他见了亿万次，早已无波无澜。

世人的遗憾、痛哭、不舍，于他而言，不过是轮回往复的寻常闹剧。
 
直到一阵轻轻的、怯生生的拉扯，拽住了他风衣的衣角。
 
微凉的触感极轻，像一片快要消散的落叶。
 
麢垂眸。
 
巷尾的路灯昏黄闪烁，光影里站着一个小小的女童，约莫五六岁的模样，穿着洗得发白的碎花小裙，浑身透着透明的虚浮，是滞留人间、迟迟不肯往生的孤魂。
 
小女孩眉眼软软的，脸蛋苍白，一双干净的眸子盛满小心翼翼的期盼，死死攥着他的衣摆，不敢用力，怕眼前这个好看又冷漠的大哥哥消失。
 
过往所有亡魂，要么痛哭哀嚎，要么戾气滔天，要么怨怼不休。唯独她，安静、温顺，像从未受过世间苦难。
 
麢薄唇轻抿，声线冷淡无温，是万年不变的摆渡语调：“夙愿是什么。我替你了结，渡你往生。”
 
他的声音没有情绪，冰冷得如同时空冰河。
 
小女孩仰着小脸，眨了眨湿漉漉的眼睛，轻轻摇头，声音细若蚊蚋：“大哥哥，我没有想要的礼物，也没有想见的人。”

林知晚也借着残存的邪气扑杀过来，招招都要置人于死地。
 
一人一灵拼命反扑，可邪终究压不过正。麢的力量沉稳克制，每一次出手，都在净化怨气，打散黑雾。
一番缠斗过后，恶灵力量消耗殆尽，本体摇摇欲坠。
 
麢一掌震飞林知晚，手中凝聚出轮回长枪，银白枪芒划破沉沉黑夜。
 
他没有先处理已经失去力量的林知晚，祸源不除，冤孽难消。
他纵身跃入翻滚的黑雾之中，一枪刺穿恶灵的本源。
 
凄厉的尖啸响彻天地，漫天黑雾轰然消散，蛊惑无数人心、沾满罪孽的恶灵彻底灰飞烟灭。
 
恶灵消亡，所有邪术瞬间失效。林知晚重重跪倒在地，借来的贵气容貌一点点衰败干裂，她原本扭曲的魂魄直接暴露出来。
 
她望着麢，满是不甘，嘶哑地辩解：“我只是想好好活下去，过上像样的日子，这也有错吗？”
 
“想要好好活着，从来不是罪过。”
麢的声音冷冷落下，不带一丝怜悯
“可你为了自己的光鲜，毁掉所有善待你的人。＂
＂受人恩惠却背信弃义＂
＂得到温暖反而烧毁灯火＂
＂用一条条无辜性命堆砌自己的荣华＂
＂这不是求生，是作恶。”
＂你罪恶滔天＂
＂无可饶恕＂
枪尖微光一闪。
 
数不尽的罪孽在此刻清算，林知晚的魂魄烟消云散，永世不得轮回。
 
困住苏念秋的结界随之破碎，一缕柔和干净的魂魄缓缓飘出，历经三年折磨，依旧澄澈如故。积压许久的冤屈，终于得以洗清。
 
待到破晓天明，朝阳洒满福利院的庭院。
孩子们照常追逐欢笑，一切看上去和往日没有半点区别。
 
城里的百姓依旧在传颂苏念秋的善良大义，没有人知晓昨夜那场生死厮杀，也无人了解这三年埋藏在温柔面具之下的滔天罪恶。
 
世人看见的，永远是外表、名声与眼前的圆满。只有轮回因果，会记下每一份人心善恶。
 
这世间最恐怖的从来不是鬼怪妖魔。
而是身处泥泞，得到旁人的善意救赎，却依旧贪光噬暖、恩将仇报，一步步把自己活成恶鬼的人心。

"https://imgbed.heliar.top/i/x8GNoQi4xxYrh4_M_IMG_2874.jpg"], content: `老城区的雨夜，永远裹着化不开的阴雾。
 
这栋老旧居民楼里，困着一缕三年不散的亡魂。
 
少女林悠然死后，魂魄一直滞留生前的屋子，记忆残缺破碎。她记得自己有心疾，记得雨夜而死，记得痛苦窒息的绝望，却完全不记得是谁害死了她。
 
亡魂执念锁死：找不到杀她的人，她永远无法离宅、无法渡往彼岸。
 
今夜，晚风刺骨，摆渡人麢踏雾而来。
 
屋内阴冷滞闷，灯光忽明忽暗。白衣少女亡魂静静伫立窗边，眼神茫然懵懂。她温顺安静，无戾气、无怨恨，只剩无尽困惑。
 
她被困三年，日日复盘死亡瞬间，却始终抓不到凶手的轮廓。
 
这是麢踏入房间时，看见的第一层巨大谜团。
 
谁杀了她？
 
整座小城，所有人都有统一答案——她的未婚夫，沈言。
 
舆论如铁，三年未改。
 
所有人都说，沈言薄情寡义、势利现实。
 
林悠然先天心脏病，常年拖累人，医药费无底洞，身体孱弱无法成婚。两人订婚多年，沈言年轻有为、前途光明，渐渐厌倦拖累，厌弃久病的未婚妻。
 
死前那夜，暴雨倾盆。
 
邻居亲眼看见，沈言深夜闯入她家，两人剧烈争吵，摔门震天。争吵结束后，沈言冷漠离去。
 
短短半小时后，林悠然发病坠亡屋内。
 
所以世人定论：沈言逼死了她。
 
是他厌弃、绝情、争执刺激，诱发她心脏病爆发，狠心弃她不顾，任由她病发孤独坠楼惨死。
 
三年来，沈言背负负心汉、杀人凶手的骂名，被全城唾骂、被亲友割裂、被万人诟病。
 
连林悠然残缺的亡魂潜意识里，也认定了这个答案。
 
麢初勘因果，眼前线索全部指向沈言。
 
哭闹争执、雨夜独处、事后冷漠离场、久病拖累的现实矛盾。
 
一切证据闭环，完美指向未婚夫行凶。
 
林悠然亡魂望着麢，眼神茫然又委屈，声音轻飘飘像雾：
“是他吗？……是沈言不要我，逼死我的吗？”
 
她困了三年，痛苦了三年，怨了三年。
 
她记得最后那场争吵，记得刺耳的决裂话语，记得心脏炸裂般的剧痛。
 
她以为，最爱她的人，最后亲手杀了她。
 
麢眼底轮回微动，暂时颔首：线索指向他。
 
只要坐实沈言罪责，便可了结因果，渡她往生。
 
可越查，越诡异。
 
谜团，层层浮现。
 
麢溯回时光残影，窥见三年过往。
 
世人嘴里薄情寡义的沈言，实则爱得偏执又虔诚。
 
所有人只看见那一夜的争吵，无人看见争吵背后的真相。
 
林悠然病重加重，急需一笔大额手术费救命。哥哥林望百般推脱，拒绝出钱，甚至逼迫林晚主动退婚，不要拖累家里、不要拖累哥哥前途。
 
林望告诉妹妹：你久病不治，配不上沈言，别耽误别人一生。
 
他一遍遍洗脑、施压、逼迫。
 
那夜争吵，从不是沈言厌弃她。
 
是沈言坚决不肯退婚，执意要倾尽家产、也要带她做手术、娶她回家。
 
所谓的争吵，是他对抗全世界的坚持。
 
他吵得凶狠，是在替她争命、争名分、争余生安稳。
 
世人看错了全部。
 
三年污名，他全盘承受，从未辩解一字。
 
只因林望苦苦哀求他：一旦澄清，所有人会怀疑林家、怀疑兄长，会毁了死去妹妹的名声。
 
沈言爱她至深，为保她死后体面，甘愿背负千古骂名，从不辩驳，任由万人唾弃。
 
他是唯一愿意倾尽一切、拿命救她的人。
 
第一层反转轰然落地，颠覆所有认知。
 
最像凶手的人，是最爱她的人。
 
那真正害死林悠然的人，到底是谁？
 
迷雾更深，疑点重重。
 
屋内另一道活人气息，缓缓浮出水面——她的亲哥，林望。
 
在外，他是全城歌颂的绝世好兄长。
 
父母早亡，长兄如父，数年含辛茹苦，省吃俭用，拼命打工养着病弱妹妹，受尽苦难，不离不弃。妹妹死后，他悲痛欲绝、年年悼念、守着空房、深情隐忍。
 
所有人心疼他、敬佩他、怜悯他。
 
连残缺的林悠然亡魂，潜意识里依旧依赖、信任自己的哥哥。
 
这是最完美、最无懈可击的第二层假象。
 
可麢轮回眼破开虚妄，撕开人皮假面，终极真相、真正凶手，彻底曝光。
 
真正杀了林悠然的，从来不是未婚夫。
 
是她倾尽信任、依赖一生的亲哥——林望。
 
一切悲剧，源于人心贪婪入骨。

 真相——
父母离世曾留下巨额财产：林悠然在世，保险金归林望林悠然终身支配；林悠然一死，保险永久作废，留百分之三十于哥哥林望，其余尽数捐赠。

林望不甘，更恨父母不平等。
所以
他编造一切
给自己塑造身份人设

他不愿妹妹死，舍不得断掉那些财源。

更不愿真心花钱救她。
怕她病好后争夺财产。怕她死后财产捐赠。
更是欺她瞒她哄她签下人身巨额意外险。
 
多年来，他克扣药物、拖延复查、刻意消耗她生机，吊着她一口气，吸食她性命换钱，塑造伟大兄长人设，博取名利同情。
 
那夜暴雨，沈言执意要带林悠然做手术，要彻底治好她。
 
一旦病愈，保险合约自动失效，林望的财源彻底断绝。
 
这是他绝对不能接受的事。
 
于是，他在沈言走后，悄悄进入妹妹房间。
 实施了他的计划

他掐断林悠然最后一点希望，故意撤掉急救药物，冷漠看着病发倒地的妹妹。
 
她撕心裂肺呼救、哭着喊哥。
 
他站在一旁，冷眼旁观，全程无动于衷。
 
亲手放任她窒息、绝望、死去。
 
他借沈言争吵的幌子，完美掩盖自己的谋杀。
又伪造她因病发坠楼而亡的现场
他面无表情抱起妹妹林悠然的身体，从楼梯上抛下。

这一切结束后
他继续虚伪的扮演，一个感人至深的好哥哥角色。
给她最盛大的葬礼

让全世界怀疑唾骂深情未婚夫，自己干干净净，坐拥美名与数不尽的钱财。
 
真相大白的瞬间，屋内阴冷雾气剧烈翻涌。
 
一直懵懂茫然的林悠然亡魂，破碎的记忆瞬间归位。
 
她想起了。
 
全部想起来了。
 
那晚沈言是为救她争吵。
 
那晚真正冷眼旁观、看着她活活死去的，是她最信任、最依赖的亲哥哥。
 
温柔、呵护、疼爱、牺牲。
 
全是假的。
 
数年陪伴，全是算计。
 
血脉亲情，全是贪婪。
 
她怨错了人，误会了最爱她的人，依赖了最恶的人整整一生。
 
极致的悲凉瞬间吞没亡魂。
 
她单薄的身躯剧烈颤抖，无声落泪。三年迷雾困魂，三年自我内耗，三年错恨深情之人。
 
麢声音清冷落雨般回荡屋内：
“世人骂薄情者最深情，世人赞守护者最恶毒。”
 
“你困于此三年，寻凶手渡魂。”
“如今真相落地，执念尽散。”
 
窗外雨停雾散，往生白光温柔笼罩少女亡魂。
 
她最后望向人间，望向那个背负污名三年、从不辩解的爱人，望向那个衣冠楚楚、贪婪噬亲的兄长。
 
爱恨清零，恩怨落幕。
 
误会蚀骨，人心最寒。
 
雾魂终解，亡魂得渡。
 
人间留下无尽讽刺——
深情者背负骂名，作恶者一生安稳。
被误解的人最爱她，被信任的人杀了她。

屋内阴雾散尽，雨夜终霁。
 
唯独人间的罪孽，尚未清算
 
天道渡善，绝不纵恶。
 
林望伪装数年的温柔兄长人设、隐忍深情的假面，在因果轮回面前寸寸崩碎，所有藏在血脉里的贪婪、冷漠、阴毒，无所遁形。
 
渡魂结束，便是惩恶之时。
 
证据顺着天道因果尽数浮现。
多年克扣药物、拖延治疗、刻意耗损妹妹生机的记录完整显现；
哄骗林悠然签下巨额意外险的合同白纸黑字；
雨夜撤掉急救药、冷眼旁观亲妹窒息惨死的全部真相，一一落地成证。
 
天网恢恢，从无遗漏。
 
短短数日，全城哗然，舆论彻底颠覆。
 
那个被所有人歌颂、怜悯、敬佩的绝世好兄长林望，一夜之间跌落神坛。
 
所有伪善面具被撕碎，多年精心营造的人设轰然崩塌。
 
曾经万人唾骂的负心汉沈言，沉冤得雪。
三年污名一朝洗尽，世人终于知晓，那个被骂薄情寡义的男人，才是全世界最爱林悠然、最想救她、甘愿为她背负一生骂名的深情之人。
 
而人人称赞的长兄，竟是蚕食亲妹性命、谋财害命、冷血弑亲的真凶。
 
真相公开的那一刻，整座老城一片死寂。
 
随之而来的，是法律的雷霆审判。
 
庭审之上，铁证如山。
蓄意谋害至亲、骗取保险、故意放任病患死亡、伪造现场误导舆论，桩桩件件，罪无可赦。
 
林望全程面如死灰，再无往日半分温良隐忍。
所有伪装尽数剥落，只剩骨子里的阴鸷与贪婪。
 
最终判决落下——
林望，蓄意故意杀人罪成立，情节极其恶劣，弑亲悖伦，罔顾人伦，判处死刑。
 
尘埃落定，善恶终有报。
 
行刑前夕，阴冷囚牢之中，四壁荒芜死寂。
林望蓬头垢面，眼神空洞，早已没了昔日光鲜体面。
 
幽暗光影里，一道黑衣身影无声而来。
 
麢缓步立于他面前，眼底无悲无喜，只剩轮回亘古不变的冰冷审判。
 
林望猛地抬头，浑身颤抖，声音嘶哑破碎，带着极致的恐惧与癫狂：“是你……是你毁了我……”
 
麢静静俯视着罪孽满身的人，声音清冷低沉，穿透死寂的囚牢，字字诛心，落地铿锵。
 
“你的人生，从来无人毁你。”
“是你的贪婪、你的自私、你的弑亲恶念，亲手毁了你自己。”
 
他目光沉沉，望着濒临毁灭的罪人，道出阴阳两界的终极宣判。
 
“林望。”
“你的罪，阳间律法已经替你清算。”
“死刑落地，人间的罚，到此为止。”
 
话音一顿，轮回眼底微光骤冷，寒意浸透骨髓。
 
“但你要记住。”
“阳间的了结，只是开端。”
“阴间的罪罚，还从未开始。”
 
林望瞳孔骤缩，浑身剧烈颤抖，无尽的绝望死死吞噬他的神智。
 
麢的声音不高，却带着跨越生死、贯穿轮回的威压，缓缓落下。
 
“我会在轮回之境等你。”
“好好记住你今日犯下的所有血债。”
“准备好，迎接你本该承受的、永无停歇的阴间炼狱惩罚。”
 
“我们，很快会再见。”
 
人间正义已然落幕，可属于恶人的炼狱，才刚刚拉开序幕。

骨生贪，血藏恶。
人心幽暗，远比雨夜阴雾更可怖。
 
轮回有序，善恶有终。
所有逃得过人间律法的算计，
永远逃不过，天道轮回的清算。

{ title: "照相馆", images: ["https://imgbed.heliar.top/i/LsIAZlAGzgo6uLvX_IMG_2871.jpg",
"https://imgbed.heliar.top/i/01VRKSNXZRVbhA90_IMG_2872.jpg"], content: `城市老巷深处，藏着一家无人知晓底细的老式照相馆。
 
门面陈旧斑驳，木质招牌褪色发白，常年落着一层薄灰。整条老街唯独这里阴气沉沉，白日无光，晚风穿巷而过，都带着一股凝滞的冷。
 
没人知道，这家看似普通的照相馆，藏着一件摄命诡物。
 
一台年代久远的老式胶片相机。
 
寻常相机定格人间光景，可这一台，定格的从来不是容颜，是人命寿元。
 
凡是踏入馆内拍照的年轻女孩，镜头一闪，皮囊无恙，笑容依旧，可无形之中，半生寿命会被瞬间剥离、吸食、封存进厚重的相册里。
 
日复一日，岁岁蚕食。
 
等到寿命被彻底抽空的那一刻，活人便会无声无息消失在世间，最后只剩下相框里一张黑白肃穆的遗照。
 
人消影存，魂入相片，永世禁锢。
 
午后阴翳，麢缓步踏入这条老巷。
 
他一身黑衣，碎发覆着眼帘，周身清冷克制，白昼人格的冷静法则深植骨血。作为不入三界、超脱轮回的摆渡人，他对世间一切邪祟异动，感知从无偏差。
 
整条巷子死气沉沉，唯独照相馆内，萦绕着密密麻麻、微弱细碎的生魂气息。
 
鲜活、年轻、却在急速凋零。
 
太不对劲了。
 
寻常阴物只吞魂噬怨，可这里，是在活生生偷取活人的寿命。
 
麢推门而入。
 
店内光线昏暗，窗帘常年紧闭，空气潮湿发闷。墙面挂满精致写真，每一张照片里的女孩都笑容明媚、青春鲜活。
 
可麢的轮回眼底，看得一清二楚。
 
这些看似漂亮的写真，底色全是死气。
 
每一张照片背后，都压着半截残缺的寿命，每一个笑脸之下，都是被透支、被掠夺、正在缓缓死去的活人。
 
柜台后坐着一个温和儒雅的中年男人，是照相馆的老板。他眉眼平和，待人客气，看起来老实本分，没有半分恶相。
 
普通、无害、平平无奇。
 
这是所有人第一眼的观感，也是最完美的假象。
 
老板抬眸浅笑，语气温和：“拍照吗？我这里拍的片子，最衬年轻人。”
 
麢淡淡垂眸，没有应声。
 
轮回眼静静扫过柜台深处那台老式相机。机身陈旧，镀漆剥落，镜头深邃漆黑，像一只永不闭合的眼，静静俯瞰人间，悄无声息收割人命。
 
无数细碎的寿元气流缠绕机身，密密麻麻，触目惊心。
 
麢瞬间摸清因果。
 
老板偶然所得这台邪物老相机，摸索出诡异用法——以他人寿元续命，摄生人之命，补己身之枯。
 
他靠着这台相机，长年窃取年轻女孩的寿命，一点点续着自己的命，苟活至今。
 
店内厚厚的相册，不是作品陈列，是累累命债。
 
每一页，都是一条被掠夺、被蚕食、被葬送的鲜活人生。
 
麢转身离去，眼底冷意沉凝。
 
他查到，明日清晨，会有一个叫苏晓冉的女生如约前来拍照。
 
这是她预约好的时间，也是她命运的劫点。
 
只要她踏入店内，按下快门，她半生寿元便会被瞬间抽走。若无人阻拦，不出七日，她会被相册彻底吞噬，人间蒸发，最终化作一张冰冷的遗照，永远留在这间阴馆里。
 
一夜转瞬即逝。
 
次日清晨，天光微亮，巷口风凉。
 
苏晓冉背着书包，眉眼干净，带着少女独有的鲜活朝气，一步步朝着照相馆走来。她满心欢喜，只想拍一组好看的写真，从未想过，这一步踏的，是索命深渊。
 
巷口阴影处，麢静静伫立。
 
他身姿挺拔，清冷孤绝，无声拦住了少女的去路。
 
“别进去。”
 
声音清淡，却带着不容置喙的笃定。
 
苏晓冉一愣，茫然抬头：“为什么？我预约好了拍照的。”
 
“里面的照片，留不住风景，只会毁了你”
 
麢字字平静，却戳破了这间照相馆最阴毒的真相。
 
少女半信半疑，却莫名心底发寒，下意识停下了脚步。
 
就在这时，照相馆门口，一个单薄的白色身影快步跑出。
 
是个身形纤弱、面色苍白的小姑娘，看着不过十几岁，脸色病态惨白，眼底藏着化不开的疲惫与隐忍。
 
她快步走到苏晓冉面前，声音轻轻的，带着一丝恳求：“姐姐，别进去拍照，真的别进去。”
 
她语气急切，满眼真诚，没有半分恶意。
 
苏晓冉接连被两人阻拦，彻底打消了进店的念头，道谢后转身离开。
 
一旁的麢冷眼旁观。
 
两个年纪相仿的女孩，温柔劝阻，他下意识以为只是好心提醒的陌生同学，并未放在心上。
 
可他不知道，这一瞬的温柔阻拦，是整个故事最深的伏笔，也是唯一的人性微光。
 
拦下女孩、断了摄命源头，时机刚好。
 
麢不再停留，转身踏入照相馆。
 
店内空无一人，老板不知去向，只余下那台静静蛰伏的老式相机，依旧散发着幽幽死气。
 
所有罪孽的根源，都在这一台机器身上。
 
麢抬手，掌心凝出凛冽冰冷的轮回长枪，银白枪芒在昏暗店内格外刺眼。
 
枪口稳稳对准漆黑镜头，寒意彻骨。
 
就在他准备扣动扳机的瞬间——
 
“咔嚓。”
 
突兀的快门声，骤然在死寂的店内响起。
 
清脆、冰冷、猝不及防。
 
无人触碰，相机自动按下快门。
 
一道暗光瞬间席卷而过，直直落在麢身上。
 
空气骤然凝滞。
 
若是普通人，这一刻早已神魂入镜、寿元尽失。
 
麢微微垂眼，看向镜头，唇角勾起一抹极淡、极冷的嗤笑。
 
眼底没有慌乱，只有全然的不屑与威压。
 
他见过三界邪祟，渡尽世间亡魂，从未有何物，敢反向摄他。
 
“区区凡物，也敢拍我？”
 
“胆大妄为，不知死活。”
 
话音落定，枪光骤起。
 
凛冽银芒轰然炸开，精准贯穿相机机身。
 
一声刺耳碎裂声响彻屋内，伴随黑烟四起，缠绕机身数年的阴邪之力瞬间崩碎、溃散、殆尽。
 
邪相机彻底碎裂报废，化作满地残片。
 
下一秒，奇迹骤现。
 
店内墙面、相册、相框里，无数鲜活的少女照片，以肉眼可见的速度褪去色彩、褪去人影，一张张变成彻底的空白。
 
数年被掠夺、被封存、被蚕食的寿元气息，尽数挣脱禁锢，漫天飘散，归还给人间，归还给原本的主人。
 
因果逆转，邪力尽消。
 
远处暗处，照相馆老板浑身猛地一震，口吐黑血，踉跄倒地。
 
相机是他续命根基，是他一身邪力来源。
 
根基被毁，反噬即刻降临。
 
数年掠夺的万千寿元瞬间剥离，所有罪孽反噬其身。
 
他皮肉极速干瘪、枯萎、塌陷，血肉层层褪去，转瞬从一个儒雅中年人，化作一具干枯嶙峋的人骨空壳。
 
魂魄被瞬间抽离躯体，悬于半空，承受无边业火灼烧。
 
满身罪孽，尽数清算。
 
麢缓步走出店门，瞥了一眼暗处形同干尸的躯壳，眼底无波无澜。
 
自作孽，不可活。
 
阳间律法管不住的阴私恶行，自有天道因果清算。
 
他无意多管，任由其自生自灭。
 
本以为，这只是一桩寻常的摄命邪案，恶人贪生怕死、掠夺人命、终遭反噬、罪有应得。
 
可真正的真相，在这一刻，缓缓揭开第二层温柔又残忍的反转。
 
那个方才在门口苦苦劝阻路人、面色苍白的小姑娘，是老板的独生女。
 
她天生身患绝症，药石无医，命数早定，时日无多。
 
老板半生勤恳，唯独放不下这个从小体弱、命途多舛的女儿。
 
他偶然得到这台摄命相机，发现可以夺人寿元、延续生机。
 
他从未贪图自己长生安稳，从未贪恋世间荣华。
 
他所有的阴私、所有的恶行、所有的掠夺，从来不是为了救自己，只是为了续命救女。
 
他看着日渐消瘦、步步濒死的女儿，走投无路，别无选择。
 
一边是无数陌生女孩的寿命，一边是自己唯一女儿的性命。
 
被绝境逼疯的父亲，终究选择了最错的那条路。
 
数年以来，他背负满身罪孽，藏起所有温柔，独自承受阴邪反噬、日夜煎熬，默默做尽恶人，只为多换女儿一日平安、一日呼吸。
 
可女儿心思通透、心底善良，早早便知晓了所有真相。
 
她知道父亲为了救她，在偷偷掠夺别人的寿命，在用旁人的命，续她的命。
 
她夜夜难安，满心愧疚与煎熬。


她身患绝症，本就命该如此，绝不愿以万千无辜之人的性命，苟活自己余生。
 
她无数次哭着劝父亲收手，恳求他放过别人、也放过自己。
 
可执念太深的父亲，早已深陷泥潭，再也听不进任何劝阻。
 
父爱偏执又沉重，疯狂又极端，哪怕背负千古骂名、永世罪孽，也要强行留住她。
 
父女二人无数次争执、拉扯、崩溃。
 
父亲死死护住她，拦住她所有想要坦白、想要赎罪的念头，一意孤行，不肯回头。
 
他可以背负所有恶名、所有罪孽、所有反噬，只求女儿活着。
 
可他不知道，他温柔护着的女儿，早已悄悄选择了大义。
 
今日清晨，是她偷偷提前守在巷口。
 
是她抢先一步，拦住了即将入店拍照的苏晓冉。
 
是她默默阻止了新一轮的罪孽诞生。
 
也是她，用自己微弱的力量，间接给了麢摧毁邪物、终结因果的机会。
 
她不想死，她眷恋父亲的温柔疼爱。
 
可她更不想，自己的余生，沾满无数陌生人的鲜血与寿命。
 
不久后，女孩得知了父亲惨死反噬、魂飞魄散的消息。
 
小小身躯瞬间崩塌，无声痛哭，肝肠寸断。
 
她怨过父亲的恶，却更懂父亲的难。
 
他是世人眼中摄命害人的恶魔，却是这辈子，唯一拼尽一切、哪怕堕入地狱也要护她活着的父亲。
 
一念贪生，满门皆罪。
 
一念向善，救赎终临。
 
风吹老巷，空荡寂静。
 
所有摄命相片尽数空白，所有掠夺寿元尽数归还，所有阴邪罪孽尽数落幕。
 
麢立在巷尾，望着远处痛哭的少女，眼底清冷微动。
 
世人善恶从来非黑即白。
 
最恶的恶行里，藏着最沉的父爱；最柔软的善良里，藏着最痛的身不由己。
 
有人为命作恶，满身罪孽；
 
有人为善舍命，一身通透。
 
人间万般执念，皆为牵绊。
 
可因果轮回，从来慈悲，也从来公允。
 
可怜，可悲，亦可敬。

陆冷刚搬来。

孩童的声音，伴着轻轻的蹦踏声，从顶楼缓缓落下。
 
不幻听、不杂音、无比真切。

两人顺着残留灵韵回溯，很快查清旧档案。
 
八年前，六楼住户，一对夫妻，六岁女儿，意外身亡于此。

豪宅明亮奢华、干净冰冷，毫无烟火温度。
 
女主人玲玉坐在落地窗前，身形单薄枯瘦，脸色惨白无神。
八年过去，她没有半分走出丧女之痛的迹象，整个人像一具被抽走魂魄的躯壳，沉静得近乎死寂。

男人脸色瞬间僵硬。

过度的回避、过度的遮掩、过度的保护。
 
越是干净利落的封口，越是欲盖弥彰。
 
陆冷和麢对视一眼，疑点彻底坐实。
 
这场所谓的“意外”，绝对另有隐情。
 
两人没有硬逼，顺势离开。夜色深沉，真相藏在平静的豪宅表象之下。
 
而当晚，深夜两点。
 
陆冷收到自己装在老小区楼下的监控推送。
 
漆黑画面里，一道纤细身影徒步走进旧楼道。

她瞒着丈夫，独自折返废弃老小区，沉默走上五楼，蜷缩坐在楼梯转角，一动不动。
 
整整一夜。
 
不上去六楼，不离开五楼，不远不近，僵在原地，像一场经年不变的守灵。

八年前的傍晚。
 
六岁的小女孩独自在楼梯玩耍，喜欢一边蹦台阶、一边认真数数。

永远消失，再也回不来。

母女二人，被两道执念生生拆分在同一栋楼的两层楼梯。

两两相望，两两无期。

乱世最不值钱的是人命，最奢侈的是相守。
 
苏家是书香世家，温润清雅。
苏晚卿生得眉眼温婉，性子柔软，是养在温室里最干净的月光。
沈砚之年少执掌兵权，双手沾满鲜血，却唯独把所有温柔都给了她。

两人自幼定亲，青梅竹马，一纸婚约拴了十余年光阴。

世人皆说，冷面阎王沈少帅这辈子唯一的软肋，就是苏家小姐苏晚卿。
 
从前岁月安稳时，他总爱待在苏家的庭院里，看她执笔画山水，看她临水绣繁花。
春日折一枝海棠插在她发间，冬夜握着她微凉的手暖在掌心。
他说等乱世平定，便卸了兵权，弃了纷争，十里红妆，许她一世安稳，从此山野炊烟，朝夕相伴。
 
苏晚卿信了，岁岁年年，满心期许。
 
可乱世无情，从不会善待圆满。
 
一夜腥风，军阀混战牵连世家，苏家满门惨遭屠灭。
烈火焚了宅院，鲜血浸透青石板，昔日温婉书香的苏府，一夜之间沦为人间炼狱。
 
是沈砚之踏着火海闯进来的。
 
彼时火光滔天，尸横遍野，年少的少帅浑身是血，劈开层层厮杀，在堆满尸体的庭院角落，找到了瑟瑟发抖、浑身沾满亲人鲜血的苏晚卿。
 
彼时她不过十七岁，一夜之间，家破人亡，世间亲人，尽数凋零。
 
沈砚之脱下染血的军装，裹住她冰冷颤抖的身子，将她死死护在怀里，声音沙哑，字字沉重，立下誓言：“晚卿，别怕，有我在，苏家没了，我便是你的家。”
 
那之后，苏晚卿便被沈砚之带在身边。
 
杀伐四起的督军府，成了她唯一的容身之地。
旁人都怕沈砚之的狠戾，唯独苏晚卿知道，这个手握生杀大权的男人，把所有的偏爱与温柔，都给了她一人。
 
他戒了烟酒，推了所有风月应酬，日日归府陪她。
怕她怕黑，夜夜守在隔壁书房，灯烛彻夜不熄；怕她触景伤情，遣散府中所有旧人，重新布置庭院，栽满她从前最爱的海棠；乱世物资匮乏，但凡寻到的软糯糕点、珍稀糖酪，尽数堆在她窗前。
 
世人皆羡苏晚卿，身陷绝境，仍得良人不离不弃。
 
可有人，却恨极了这份圆满。
 
林知鸢，是常年跟在沈砚之身边的世家旁支小姐，半生爱慕，半生追逐。
 
她看着沈砚之纵横沙场、锋芒万丈，看着他冷对万人、铁石心肠，却唯独对苏晚卿温柔缱绻、百般纵容。
她爱慕了他十几年，倾尽所有卑微讨好，换来的永远是他的淡漠疏离。
 
凭什么？
 
凭什么苏晚卿不过是一个家破人亡的孤女，就能占据他全部的真心？
凭什么乱世浮沉，万人争抢的沈少帅，唯独对她俯首温柔？
 
嫉妒像毒藤，日夜啃噬她的心肺，一点点扭曲了她的本心，将她彻底拖入疯魔。
 
她不甘心，她要取而代之。
 
寻常的算计离间，根本拆不开情深至此的两人。
于是林知鸢走遍荒山野岭，寻访隐世邪师，触碰禁忌歪术，沾染阴邪之气，甘愿以身饲魔，坠入鬼道。
 
她偏执地认定，只要苏晚卿死了，她就能留在沈砚之身边，拥有那份独一无二的温柔。
 
日复一日，她修习邪术，神魂被戾气浸染，眉眼间的少女温婉尽数褪去，只剩扭曲的阴狠。
她筹谋许久，布下逆天夺舍大阵，赌上自己半生修为、半条性命，只为夺了苏晚卿的身子，顶替她的人生。
 
那是一个细雨绵绵的寒夜。
 
督军府海棠落尽，湿气浸骨。
苏晚卿佩戴着自幼贴身、苏家代代相传的白玉佩，安静卧在榻上。
那玉佩温润通透，藏着苏家百年福泽，更是锁住轮回记忆的结界。

阴气席卷整座院落，黑雾穿窗而入，缠上苏晚卿的四肢百骸。
榻上的少女骤然窒息，心口剧痛，眉眼瞬间失了血色，温热的身躯一点点变得冰凉。
 
夺舍之术残酷至极，是硬生生碾碎原主魂魄，鸠占鹊巢。
 
林知鸢站在阵中，发丝凌乱，双目赤红，周身黑气翻涌，笑得癫狂又偏执：“苏晚卿，你的命，你的爱人，你的一切，从今往后，都是我的了。”
 
她看着榻上少女气息渐断，魂魄摇摇欲坠，心中狂喜不已，即刻催动全部妖力神魂，朝着苏晚卿的躯体冲去，欲彻底占据这具身躯。
从此以她的模样，伴在沈砚之身侧，岁岁年年，永不分离。
 
可就在她神魂入体、即将扎根的刹那，苏晚卿胸口的白玉佩骤然亮起柔和清光。
 
白光骤然炸开，裹挟着林知鸢的魂魄，强行将她拉入一片无边幻境。
 
天地静谧，山河古旧，并非民国烟火，而是千年前的旧世光景。
 
幻境之中，一面古朴铜镜悬于虚空，镜面澄澈，照见轮回所有真相，照见她穷尽一生、疯魔争抢的所有荒唐。
 
铜镜映出的，不是今生阴狠偏执的林知鸢，而是一位眉眼清朗、身姿挺拔的白衫少年。
 
那是她的上一世。
 
千年前，她是栖身山野的少年郎，是苏晚卿前世唯一挚爱，是护她一生、爱她入骨的心上人。
 
那时的苏晚卿，是世间最明媚的姑娘，却身中无解蚀骨奇毒，药石无医，命不久矣。
天下名医束手无策，唯有一种上古毒引，可解她周身剧毒，可此毒霸道诡谲，触碰者必遭反噬，神魂俱损，形体异变。
 
无人敢试，无人愿舍。
 
唯独他。
 
少年爱她至深，甘愿以身饲毒，以自身神魂血肉为祭，以身试遍万千剧毒，硬生生炼化毒引，尽数渡入自己体内，为她解了缠身绝症。
 
剧毒反噬惊天动地，毁了他男儿骨血，碎了他本来形体。
 
他渡劫失败，神魂受损，身躯蜕变，生生从一介清朗少年，化作了半生流离、不得归期的蝴蝶女妖。
 
他拼尽一切，换她安然无恙，换她岁岁无忧。
 
她活了下来，眉眼依旧明媚，性命得以保全，却唯独忘了他。

我姓林，单名一个执字。
 
我爱上了一个姑娘，一个姓苏的姑娘。
 
山林养我十八年，百草育我一身骨。
 
世人都说林家隐世，是世外药脉，擅活死人、医白骨，掌世间最精妙的百草秘术。
可无人知晓，深山岁月漫长清冷，我自小无伴，眼底只有四季常青的药田、岁岁不败的花海，和终年不散的山雾。
 
我的性子冷，心也静。
 
在遇见她之前，我以为我这一生，只会守着这片山，看花开花落，看朝暮更迭，无喜无悲，无牵无挂，直至尘归山海。
 
直到那年春深，漫山芳菲压枝，我遇见了苏晚卿。
 
她是闯进我孤寂岁月里唯一的人间春色。
 
那日天光温柔，穿透层层林叶，她提着一只素色竹篮，弯腰采花，唇角带着浅浅笑意。风拂起她的衣袂，也拂乱了我古井无波的心。
 
我长居深山，不通人情，不识情爱，从未见过这般干净温柔的人。
 
那一刻，心口骤然狂跳，震得我指尖发颤。
 
我不知道什么是一见钟情。
 
我只知道，从我看见她笑的那一眼起，我荒芜沉寂的岁月，轰然盛开了整片花海。
 
我生平第一次主动靠近生人，声音有些不自然，告诉她，这片无边花海，皆是我亲手栽种。
 
我怕她看花不识草，便一一同她说。
 
哪花性平温和，哪花耐寒耐霜，哪花最香，哪花最娇。
 
我把珍藏多年、品相最好的花种，悉数装进她的竹篮，一颗不留。
 
她抬眼看我，眉眼柔软，轻轻说了一句谢谢。
 
那声谢谢，落在我心里，缠了我千年。
 
她走的时候，暮色垂落山林。
 
我立在花海中央，看着她的背影渐渐消失在山道尽头。
 
此后日复一日，我守在花开的地方等她。
 
山风来过，花期重来，草木枯荣数遍，我再也没有见过那抹素衣身影。
 
我不懂相思，不懂牵挂，只知道心里空了一块，日日念念，夜夜辗转。
 
初遇临别，我见她身形单薄，气息偏虚，便将祖传暖玉赠予她。
 
我说：“你身子弱，此玉温脉养神，可护你安康。”
 
那是我这辈子送出的第一份礼。
 
也是我宿命的开端。
 
我以为那一面之缘，已是此生全部缘分。
 
我万万没想到，再见之时，是天意倾覆，是生死当头。
 
那日风和日暖，花海如常盛放。
 
可我的花海里，倒下了一身是血的苏晚卿。
 
她满身污渍，衣破伤重，脸色惨白如纸，往日温柔灵动的人，此刻气息微弱，随时都会消散在春风里。
 
那一刻，我十几年清冷修持尽数崩塌。
 
我抱着她狂奔回药庐，指尖触到她冰凉的皮肤，心底第一次生出恐慌。
 
我是林家后人，自幼通读百草毒经，通晓世间大半疑难杂症。
 
可我查不出她的毒。
 
那毒太邪、太寂、太无解，悄无声息蚕食五脏，腐蚀心脉，连神魂都在一点点枯朽。
 
我翻遍祖屋万卷医书，熬尽珍稀药草，日夜不离，寸寸探脉，次次无功。
 
万般绝境之下，我破了山林禁忌，求见隐世长老。

“此毒绝世，世间无解。”
 
“中毒者不过十余日，五脏渐腐，心智渐消，最后血肉消融，化为血水，魂飞魄散。”
 
我站在原地，浑身发冷。
 
我问他，真的没有办法吗。
 
长老看着我，字字沉重：“无解。除非——以命换命，逆天改命。”
 
那一刻，我没有半分犹豫。
 
我终于知晓她的来历。
 
她是苏家嫡女，家族权斗惨烈，至亲尽数被毒害惨死，只剩她一人被逼追杀，身负绝世剧毒，一路逃亡，最后昏死在我的山海花田里。
 
偌大人间，她无处可去。

余下的十数日，我守着她，陪着她。

我翻出林家百年封禁的禁忌秘卷，寻到那唯一的逆天秘方。
 
以身饲毒，以己身神魂血肉为媒介，转嫁剧毒，换对方生机。
 
代价，是施术者神魂破碎，记忆尽失，命格改写，形骨重塑，万劫不复。
 
族长闻讯赶来，厉声拦我。
 
“你是林氏唯一正统，你会死，会魂灭，会永世不得安宁！”
 
我抬头，神色平静，却决绝到底。
 
“我要她活。”
 
天下大道，家族祖规，万世修行，皆不如她。
 
我启动秘术，以身试毒。
 
剧毒侵体的那一刻，万毒噬心，经脉寸寸断裂，神魂像被碾碎成灰。
 
秘术反噬、剧毒戾气、山林禁力，三者相撞，时空剧烈扭曲。
 
天道不允凡人逆天改命。
 
所以它毁了我。
 
它碎了我所有记忆，抹掉我十八年山林岁月，抹掉我是林执的一切过往。
 
它拆我男儿骨血，重塑女身。
 
凡人之躯彻底剥离，被戾气与术法催生阵法，一只蝴蝶却突然闯入。

至此
我成了一只宿命飘零、无依无靠的蝴蝶女妖。
 
记忆彻底消散的最后一瞬，我拼尽最后一缕残魂，彻底完成置换。
 
毒入我身。
 
生机归她。
 
苏晚卿活了。
 
可天道的惩罚，从未止于一身。
 

时空扭曲撕裂出无边幻境，是轮回之境。
 
我与她，双双卷入虚幻浮生。
 
她解毒重生，却也被时空余波震碎记忆，前尘尽忘。
 
而我，化作妖身，载着千年不灭的反噬，被锁进轮回。
 
百年一轮，千载一渡。
 
我们在虚幻轮回里辗转了近千个春秋。
 
一世相逢，一世相忘。
 
一世温柔，一世擦肩。
 
命运反复戏弄，缘分反复拉扯。
 
曾经的山林少年林执，早已在那场逆天换命的大雪里，碎骨消魂。

林知鸢。
 
到最后。

"https://imgbed.heliar.top/i/vTPKEkZwjbLeSPZa_IMG_2896.jpg"], content: `整整一月，知夏都被困在一场无解的梦魇里。
 
梦境固定在一座废弃私立医院。
惨白脱落的墙皮、潮湿死寂的长廊、挥之不去的铁锈混着消毒水的腐冷气味，冷风穿堂呜咽，压得人心神俱寒。
 
梦里她只能不停奔跑。
 
身后跟着一名戴口罩的医生，步伐缓慢却带着绝对掌控的压迫感，无论她怎么逃窜，距离永远无法拉开。
一旦被抓到，刺骨针管、冰冷器械、无休止的活体折磨便会接踵而至。
梦里的痛感太过真实，魂魄被剥离的空洞酸胀，日日刻在神经之上。
 
每一次天光破晓，知夏都会冷汗浸透、惊悸惊醒。
长期的阴梦纠缠蚕食神志，让她日渐虚弱恍惚，整个人被无形阴翳牢牢裹住。

午后闹市人潮喧嚣，知夏想借人间烟火压下心底寒意，独自出门散心。
她心绪纷乱走神，转身时不慎撞上一道冷峭挺拔的身影。
 
“抱歉。”
 
抬头瞬间，她撞进一双看透阴阳、沉寂无波的黑眸。
 
麢立在人流之中，周身隔绝俗世喧闹，气质孤绝寒凉，是游走两界、执掌轮回审判的摆渡人。
 
仅是擦肩一瞬，他眸底骤然凝色。
 
知夏的魂魄外层，缠绕着一层厚重黏腻的阴煞黑气，根深蒂固，绝非偶然沾染。
这是长期被阴灵锁魂、怨念侵体的征兆，再持续下去，她终将魂魄耗竭、灯枯油尽。
 
麢视线穿透虚妄，望向她身后的虚空阴影。
 
一抹猩红静静蛰伏。
 
红衣曳地，怨气滔天，煞气凛冽，是阴阳两界人人忌惮的红衣厉鬼。
 
麢指尖微聚灵力，欲勘破因果。可那红衣阴灵警觉至极，灵力微动的刹那，瞬间敛尽煞气，化作残影遁入深巷，消失无踪。
 
麢循着残余滔天怨念追踪而去，一路剥离市井烟火，抵达城市夹缝深处。
 
一栋荒废多年的私立医院，死寂伫立。
荒草漫阶、窗朽墙霉，整栋楼宇被浓稠黑雾封锁，死气沉郁，阴风刺骨。

踏入废院的一刻，层层叠叠、积压百年的怨念轰然扑面。
无数惨死、绝望、不甘的阴息交织成深海般的寒意。
即便是见惯阴阳的麢，也微微蹙眉。
 
迷雾太深，贸然探查只会打草惊蛇。
麢转身折返，将调查重心落回知夏身上。
 
暮色温柔，街灯缱绻。
 
知夏身侧靠着男友沈叙。
 
他身姿挺拔、眉眼温润、斯文体贴，一举一动皆是恰到好处的温柔宠溺，在外人眼中是无可挑剔的完美恋人，也是知夏深陷梦魇折磨时，唯一的安稳与寄托。
 
唯有依偎在他身侧，心底的恐惧才能稍稍平息。
 
暗处的麢冷眼旁观，无波无澜。
 
骤然天色剧变。
 
暖风转瞬成刺骨阴风，黄昏顷刻暗沉，煞气暴涨覆压天地。
 
一道猩红残影撕裂空气，女鬼红衣翻飞、怨气炸裂，携着汹涌恨意直直扑向知夏，杀意凛冽，势如夺命。
 
知夏瞬间僵滞，浑身冰凉，连日梦魇的恐惧席卷全身，让她动弹不得。
 
生死刹那，冷白身影瞬闪而至。
 
麢抬手结印，黑白灵力轰然铺开，结界瞬间锁死虚空，强势将红衣女鬼禁锢半空。
阴风骤停，煞气尽散。
 
被缚的女鬼缓缓仰头，凌乱发丝下，惨白面容扯出一抹凄烈癫狂的笑。
血泪滚落，浸透猩红裙摆，破碎的笑意在暗沉街头回荡，悲凉又诡异。
 
麢扣住她飘摇残破的魂体，转瞬退入无人窄巷，布下密闭结界，开启轮回之眼。
 
淡金微光穿透虚妄，直探因果。
 
“为何夜夜入梦缠她，耗她生机。”他声线清冷，是审判者的审讯。
 
女鬼魂体颤抖，血泪不止，眼底盛满无尽苍凉：“你什么都不懂……”
 
话音未落，异变陡生。
 
巷外虚空突窜一道极阴毒黑煞，穿透结界缝隙，直指女鬼魂体，力道决绝——是要当场磨灭她的残魂，让她永世封口。
 
女鬼魂体寸寸皲裂、濒临湮灭。
 
麢瞬间洞悉猫腻，反手凝盾挡下绝杀。
暗处之人一击落空，气息瞬间隐匿无踪。
 这一切都太过诡异

麢不再保留，全力催动轮回之眼，撕裂层层岁月封印，重塑了女鬼记忆。
 
女鬼名唤晚璃。
她的记忆中竟出现了一张熟悉面孔——沈叙
记忆中两人亲密无间
就如现在的之夏和沈叙一般

记忆层层重组
直到出现下面一幕
那夜大雨倾盆，因为好奇跟踪深夜出门的沈叙。晚璃撞破了一件事，也是这件事让她万劫不复，被拖入无尽深渊。

原来她根本就不是什么恶煞，
而且是沉冤三百年的受害者。
 
而温润儒雅的沈叙，不是凡人不是良人，是隐匿于人间三百年的邪修。
 
他专修禁术，不靠天地灵气，唯以活体炼魂、掠夺少女寿元维系长生。
他极善攻心伪装，以温柔深情为面具，专挑孤身无依的少女下手，无人追查、无人求证，方便他岁岁猎杀、无声抹杀，堆砌自己的长生基业。
 
晚璃是他无数受害者中，唯一拼死留存残魂、侥幸未灭的人。
 
曾经的晚璃，亦如如今的知夏，沉溺在沈叙的温柔骗局里，满心信任、毫无防备。
直到她撞破废院的血腥真相——这里从不是闹鬼凶地，是沈叙三百年不变的炼魂囚笼、活体刑场。
 
她亲眼看见，斯文温柔的沈叙面无表情抽离前任少女的寿元，断送鲜活性命。
 
沈叙被撞破罪孽后，褪去所有温情，只剩刺骨杀意：“既然你看见了，便不必再演了。”
 
此后，晚璃被长期囚禁废院，日日承受抽魂炼寿的酷刑，皮肉魂魄日夜被摧残掠夺。
她凭一口不甘执念拼死出逃，却在暴雨深夜的废院天台被沈叙堵截。
 
为了不再沦为养料、留存一丝真相，一袭红裙的晚璃纵身坠楼。
 
身死刹那，极致冤屈恨意凝成红衣煞体。
 
可她即便化煞，依旧敌不过三百年邪修的沈叙。
三百年来，所有窥探真相、试图逃离的受害者，尽数被他暗中抹杀、魂飞魄散。
唯有晚璃，在阴阳夹缝中苟延残喘。
 
直到她遇见和自己一样被沈叙盯上的知夏。
 
看着干净单纯的知夏一步步沦陷信任、走向绝境，晚璃焦灼绝望。
她魂体残破、无力对抗沈叙，更无人会信一只厉鬼的辩解。
 
绝境之下，她只能以命设局。
 
她夜夜入梦纠缠，用恐惧敲打沉溺骗局的知夏；她刻意当众展露杀意、主动扑杀，制造灵异事件
 
她以自身入局、以命求救。
 
她赌上残魂与轮回，引出能审判邪祟的麢，这是她唯一能救下知夏、揭穿罪孽的方式。
 
世人所见的恶鬼行凶，是泣血救赎。
世人所见的恶意纠缠，是绝境微光。
 
真相铺开，结界内死寂寒凉。
最凶的鬼，藏着最善的念。
最温柔的人，藏着最毒的恶。
 
麢窥见三百年累累罪证，百余条无辜亡魂，尽数葬送于沈叙的温柔屠猎。
 
他护住怨气散尽、魂体通透的晚璃，转瞬返回街头。
 
灯火依旧温柔，知夏仍依偎在沈叙身侧，眉眼安然，对一切罪孽一无所知。
 
“三百年了，还没演够？”
 
清冷声线破空，撕碎所有温情假象。
 
沈叙瞬间僵滞，笑意凝固眼底，温润皮囊下戾气翻涌，罪孽彻底败露。他强作镇定，意图伪装抵赖。＂我不知道你是什么意思＂
 
麢字字铿锵，步步逼近：“三百年活体炼寿，百余人冤魂枉死。”
“沈叙，你的骗局该落幕了。”

闻言沈叙阴冷狞笑出声：“既然被你看穿，今日便无人能活着离开此地”
言语间滔天黑煞暴涨席卷天地，沈叙展露邪修真身，狞笑着催动三百年邪力绝杀袭来。阴毒术法汹涌噬命，与麢的黑白灵力轰然对撞，气浪翻涌震颤四方。
 
沈叙纵横人间三百年，术法阴诡根基深厚，缠斗间步步强攻，却始终被麢稳稳压制。
绝境之下他邪力暴走，欲同归于尽。
 
麢眼眸轻阖，黑白双魂同临现世。
 
渡灵与裁决之力交织迸发，黑发染雪，气场登临巅峰。一念裁决，万邪寂灭。
 
纯净磅礴的灵力凝成破空光束，贯穿漫天黑雾，瞬间碾碎沈叙所有邪力根基、护体煞气。
 
巨响震彻四野，沈叙重伤坠地，魂体残破、修为尽废，满眼惊骇绝望。
 
“滔天罪行，无可饶恕，罚你入无间地狱，历三百年轮回酷刑，亲偿百余人魂痛。刑满，魂飞魄散，永世无生。”
 
天道枷锁锁死残魂，拖拽坠入地狱，三百年血债终得清偿。
 
阴云散尽，天地清明。
 
晚璃红裙褪尽血色，戾气全无，遥遥望向知夏，浅浅一拜，化作柔光静待引渡。废院沉雾消散，无数沉寂百年的亡魂虚影缓缓现世。
 
麢抬手开启轮回正道，三日三夜不息，孤身引渡所有冤魂，送她们脱离怨地、重入新生。
 
百年冤案，彻底尘埃落定。
 
全程见证所有真相的知夏，僵立风中，浑身彻骨冰凉。
 
她终于知晓，夜夜萦绕的梦魇从不是恶鬼加害，是晚璃赌上一切的唤醒与救赎。
人人唾弃的厉鬼，是救她性命的恩人；
她全心依赖的恋人，是屠戮百年的恶魔。
 
所有温柔宠溺，是精心算计的捕猎陷阱。
所有甜蜜陪伴，是白骨铺垫的邪恶长生。
 
后怕、愧疚、心酸、庆幸交织心底，热泪无声坠落。
她险些葬身温柔地狱，沦为无名亡魂，是晚璃从深渊口硬生生拽回了她。
 
风过人间，天光澄澈。
 
知夏望着朗朗夜空，心底归于沉静释然。
 
善恶终有报，天道终分明。
她侥幸得存的余生，是无数亡魂未能看见的天光。
 
往后岁月，她将带着这份沉重的恩情与救赎，好好活下去，替所有长眠黑暗的人，好好看遍人间山河万里。`, authorNote: ["沈叙三百年，吸食寿命，温柔圈套让遇见的女生依赖他，享受这种感觉，玩够了就把这些女生全部吸食掉",

云熙站在门槛上，浑身浸透，水珠顺着发梢不停往下淌。她脸色白得像一张浸过水的纸，肩膀不受控制地发抖，声音碎在雨声里。
 
“陆冷，我看见鬼了。”
 
陆冷抬眼，心里一沉。
 
他做灵异博主许久，看多了编造出来的惊悚故事，本不容易被吓到。可上一桩怪事之后，他已经清楚，这个世界确实有阴阳边界之外的东西。他放下手里正在剪辑的素材，快步扶她进来，递过一条干毯子。
 
“慢慢说，别急。”
 
云熙死死攥着他的手臂，指尖冰凉僵硬，力道大得几乎要嵌进皮肉里，眼眶通红，泪水混着雨水不断滚落：“我不敢回家，我真的不敢回去……那个东西，它一直跟着我，它想杀了我！”
 
极致的恐惧裹挟着她，让她语无伦次，浑身止不住地发抖。
 
陆冷见她情绪彻底失控，知道普通的安慰毫无用处。他沉吟片刻，心底浮现出那个唯一能化解阴邪诡事的人。
 
“你别怕，我带你去找一个人。”
 
 
于是深夜，两个人穿过寂静长街，走到那座藏在老街深处的小院。
 
麢立在廊下，眉眼淡漠，周身萦绕着生人勿近的疏离感，自带看透阴阳生死的凛冽气场。
 
“拜托你帮帮她，”陆冷语气急切，“你说是灵魂孟婆，阴阳之间的事，只有你能摆平。”
 
麢轻轻抬眼，淡淡扫了他一眼。
 
“是灵魂摆渡人。孟婆熬汤渡亡魂，我不熬汤，只裁执念，收恶鬼。”
 
他的视线落在惊魂未定的云熙身上。
 
“讲。”
 
故事从图书馆那个午后开始。
 
云熙遇见江屿。阳光落在书架之间，男生温和干净，说话时语调轻柔。
一来二去，两人慢慢熟悉，暧昧一点点涨起来，直到江屿认真告白。
云熙本来就动心，笑着应下，以为自己接住了一段安稳温柔的缘分。
 
变故，是从她答应和他在一起之后才开始的。
 
夜里，房间里总是多出来一道气息。
明明门窗锁得严实，屋子里只有她一个人，她却总觉得暗处有人静静看着。

许知夏魂体猛地一颤，像是被人狠狠撕开伤疤，她失声痛哭，终于吐出那个藏了三年、不敢触碰的名字：
 
“……我双生姐姐，许知瑶。”
 
第一层震动人心的隐情揭开：
 
她不是无人相救。
 
她惨死的全过程，亲姐尽收眼底，冷眼旁观，见死不救。
 
世人皆以为，这已是全部真相。
 
可麢知道，不对。
 
若只是旁观，怨不会深至此地。
 
他继续往前回溯——赴约之前。

两姐妹容貌无二，心性天差地别。
 
妹妹许知夏，温柔单纯，干净赤诚。
姐姐许知瑶，外表温婉，内里狭隘阴鸷。
 
两人年少一同遇见温润少年陆景淮。
 
双双心动。
 
可陆景淮自始至终，眼里、心里，只有干净纯粹的许知夏。
 
他会温柔唤她夏夏，会给她带糖，会护着她的小性子，眼底的温柔偏爱，从来只属于妹妹一人。
 
一模一样的脸。
 
永远，妹妹是被选择的那一个。
 
姐姐是被忽视的影子。
 
数年岁月，嫉妒在心底生根、腐烂、长成剧毒。
 
许知瑶不甘至极。
 
凭什么？
 
凭什么同一张皮囊，她只能做替身，只能活在阴影里？
 
于是她开始伪装。
 
日复一日模仿许知夏的语气、神态、小动作、喜好。

陆景淮毫无察觉。

他所有的温柔、情话、偏爱，整整一年，尽数给了假扮妹妹的姐姐。
 
偷来的爱情短暂虚妄，填不满她疯长的贪念。

永远随时会被拆穿，永远成不了正主。

死得干干净净，死得无人怀疑。
 
她布下了一场完美杀局。

四个纨绔可恨、该死。

真正的恶鬼，自始至终，是她的亲姐。

雨夜废楼，许知夏血流殆尽，含恨而绝。

满堂死寂。
 
陆景淮浑身僵住，血液瞬间冻僵四肢百骸。

他猛地看向身侧温柔相伴三年的妻子，眼底的深情寸寸碎裂，转为极致的陌生、恐惧、冰凉。

三年朝夕。

三年温柔。

三年情深。

原来自己日夜疼宠的人，是害死自己心上人的真凶。

原来自己的每一次温柔，都落在沾满鲜血的骗局之上。

许知瑶的所有伪装，彻底崩裂。

麢眼神无半分波澜。

错不至死？

借刀屠亲，窃命偷生，瞒天过海三年安稳。

此罪，永世难赎。

他抬手，阴阳灵力一瞬锁死她魂魄。

白光凛冽而过。

许知瑶一声凄厉惨叫，魂魄寸寸溃散

魂飞魄散，永世不得轮回。

人间罪孽，尽数清算。

豪宅空空，红烛犹暖。

一具享尽宠爱、锦绣圆满、毫无伤痕的躯体，骤然成了空壳。

阴风缓缓穿堂而入。

白衣女鬼许知夏，静静立在灯火暗处。

大仇得报。

仇人尽灭。

可她没有半分解脱。

只剩无边无尽的空洞与悲凉。

她看着那具顶替自己三年、偷走自己全部人生的躯壳。

那里有她本该拥有的岁岁平安，有她本该拥有的爱人温柔，有她被生生碾碎的十八岁。

她慢慢抬步。

一步步，走向那具温热完好的肉身。

亡魂入躯，恶鬼为人。

从此--

世间再无枉死女鬼许知夏。
再无恶毒姐姐许知瑶。

只剩她。

披着仇人的皮囊，住着偷来的家，守着一场沾满自己鲜血的爱恋。

日日对着深爱自己、却认错人的少年。

岁岁活在谎言里，年年困在血海债里。

爱错位，恨无解，人鬼颠倒，余生永囚。

这是她最后的复仇。

也是她，永世不得解脱的沉沦。

六年孤身，无边死寂。
 
这一刻，我几乎沦陷。
 
原来我不是最后一个。
原来世上还有同类。
原来我不用永远一个人逃亡、一个人杀尸、一个人扛住整片地狱。
 
她抬头泪眼朦胧看着我：
“哥哥，你能带带我吗？我不敢一个人待着……我可以听话、可以帮忙、我不拖后腿。”
 
我沉默两秒，缓缓点头。
 
人性尚存，绝境遇伴。
 
我以为，这是六年黑暗末世里，唯一的救赎。
 
我万万没想到——
 
这是我这辈子，最致命的一次天真。
`},
  { title: "第二章", images: ["https://imgbed.heliar.top/i/sPpfhPoxWoft0zEg_%E6%88%AA%E5%B1%8F%202026-11-19%2016.14.07.png",

"https://imgbed.heliar.top/i/LySU8dJWEbr5Xgm3_%E6%88%AA%E5%B1%8F%202026-11-19%2019.41.00.png"], content: `女生名叫苏晓。
 
她说自己躲在地下密室存活六年，父母全部惨死，独自苟活到现在。
 
她说话温柔、眼神干净、胆子极小。
 
一路上只要听见一点丧尸动静，就吓得紧紧贴住我，浑身发抖。
 
我一路杀尸开路，护着她穿梭废墟。
 
我杀疾行丧尸、绕开巡夜尸群、避开领主级怪物的巡逻区。
 
她跟在我身后，乖巧、安静、从不添麻烦。
 
一路上她不停道谢：
“幸好遇到你。”
“没有你我肯定活不下去。”
“你真好，你是我的救命恩人。”
 
六年孤独积压的荒芜，好像被这几句人话慢慢填满。
 
我甚至第一次生出念头：
 
或许……末世不一定永远只有杀戮和孤独。
 
或许，我也可以有人同行。
 
傍晚，灰雾渐浓，夜色将至。
 
我带着她找到一处极其隐蔽的高层安全屋，防盗门锁死、无尸群、视野绝佳。
 
这是我珍藏很久、从来不舍得用的终极藏身点。
 
我拿出仅剩的半块干粮，分给她大半。
 
她吃得很慢，眼睛红红的看着我：
“你为什么分给我？你自己也不够吃啊。”
 
我淡淡道：
“活着不容易。两个人，就多分一点。”
 
她低头轻笑，眉眼温柔。
 
那一刻，我彻底放下所有戒备。
 
丧尸杀我六年，从未让我绝望。
 
可下一秒——
 
脖颈骤然剧痛。
 
冰冷、尖锐的金属，狠狠刺入我的侧颈。
 
鲜血瞬间喷涌。
 
我浑身僵硬，难以置信低头。
 
是她。
 
是刚刚还在哭、还在道谢、还依赖我的苏晓。
 
她手里握着一把锋利的碎玻璃，脸上所有柔弱、恐惧、纯真，瞬间尽数褪去。
 
取而代之的，是一种极致冷漠、极致贪婪的笑。
 
她轻声在我耳边低语，温柔又残忍：
 
“傻子。
你真以为末世还有善意？”
 
“你这种会打猎、会杀尸、熟悉全地图、有生存经验的活人——才是末世最珍贵的物资。”
 
我血液飞速流失，视野开始发黑。
 
我盯着她。
 
六年尸海我没死。
无数次绝境逃亡我没死。
领主围杀、尸潮吞城、断粮绝境我都没死。
 
我没死在丧尸嘴里。
我死在了同类手里。
 
她擦掉脸上伪装的泪水，笑意冰冷：
 
“你知道为什么六年从来遇不到活人吗？”
 
“因为活下来的人，全是吃人的。”
 
“软弱的、善良的、心软的、愿意救人的——
早就被我们杀光了。”
`} ,
 { title: "第三章 最刺骨的人性真相", images: ["https://imgbed.heliar.top/i/sPpfhPoxWoft0zEg_%E6%88%AA%E5%B1%8F%202026-11-19%2016.14.07.png",

"https://imgbed.heliar.top/i/LySU8dJWEbr5Xgm3_%E6%88%AA%E5%B1%8F%202026-11-19%2019.41.00.png"], content: `她缓缓站直身体，不再伪装半分。
 
门外，传来轻微脚步声。
 
三个男人，两高一壮，持枪走进安全屋。
 
他们看着倒地流血的我，眼神毫无波澜，只有狩猎成功的冷漠。
 
苏晓淡淡开口：
“他资源很稳，身法极好，熟悉整片城区。
跟了一路，确认没有陷阱。”
 
领头男人低头看着我，语气平淡得像在谈论食物：
 
“末世规则很简单。”
 
“丧尸只会杀你一次。”
 
“活人，会骗你、利用你、博取你同情、最后榨干你所有价值再杀你。”
 
我终于全部懂了。
 
懂了为什么六年全世界只剩我一个“活人”。
 
不是没有幸存者。
 
是所有幸存者，全部沦为了猎人。
 
他们抱团、伪装、诱捕、猎杀独行善人。
 
善良者死。
心软者死。
信任者死。
 
唯独冷漠、自私、残忍、无情的人，能活。
 
苏晓蹲下身，看着我逐渐涣散的瞳孔，轻声道：
 
“你太孤独了，对不对？”
“所以你看见同类，就毫不犹豫选择相信。”
“这就是你的死穴。”
 
“末世最致命的，从来不是尸潮。
是人性的弱点——渴望陪伴、渴望善意、渴望温暖。”
 
我喉间腥甜汹涌，鲜血浸透衣衫。
 
窗外，满城丧尸悠悠游荡。
 
它们腐烂、丑陋、凶残、无脑。
 
可它们从不欺骗、从不伪装、从不假意温柔、从不利用真心。
 
这一刻。
 
我突然极致荒谬地清醒。
 
原来丧尸，才是这片末世最干净的东西。
 
至少它们坏得坦荡。
 
而活人，坏得入骨。
`} ,
{ title: "第四章 浴血反杀，撕碎温柔地狱", images: ["https://imgbed.heliar.top/i/sPpfhPoxWoft0zEg_%E6%88%AA%E5%B1%8F%202026-11-19%2016.14.07.png",

"https://imgbed.heliar.top/i/i0psZnW2hbvITYRh_%E6%88%AA%E5%B1%8F%202026-11-19%2019.40.05.png",
"https://imgbed.heliar.top/i/TLDmS2qb9sem9MV4_%E6%88%AA%E5%B1%8F%202026-11-19%2019.40.33.png",
"https://imgbed.heliar.top/i/LySU8dJWEbr5Xgm3_%E6%88%AA%E5%B1%8F%202026-11-19%2019.41.00.png"], content: `就在他们放松警惕、准备搜刮我背包的瞬间。
 
我濒死的眼底，骤然炸开滔天冷光。
 
六年尸海生死历练，我的身体，早就超越常人极限。
 
我猛地塌身、拧腰、反手抓刀——
 
猎刀寒光一闪，直接划破最近一名男人的手腕。
 
枪械落地！
 
所有人瞬间色变！
 
“他还能动！”
“快杀了他！”
 
苏晓脸上温柔彻底碎裂，露出狰狞：
“垂死挣扎！”
 
三人瞬间扑杀上来。
 
但他们常年靠诱捕偷袭为生，从未真正直面过尸潮、从未经历绝境搏杀。
 
他们的狠，是对弱者的狠。
我的狠，是从地狱爬回来的杀生本能。
 
我颈间流血不止，视线模糊，却招招致命。
 
一刀封喉，一刀破腹，一刀断筋。
 
血腥瞬间洒满整间温暖的安全屋。
 
三声惨叫接连落幕。
 
短短三秒，三个持枪猎人，尽数倒地。
 
现场只剩苏晓一人，脸色惨白，连连后退。
 
她终于慌了。
 
再也没有温柔伪装，只剩极致恐惧：
“你……你到底是什么怪物？”
 
我捂着流血的脖颈，缓缓站直身体。
 
浑身浴血，气息冰冷刺骨。
 
我看着她，轻声开口，声音沙哑得像是砂纸摩擦：
 
“我是在尸狱里活了六年的人。”
“我杀过的怪物，比你见过的活人多万倍。”

我看着她，轻声开口，声音沙哑得像是砂纸摩擦：
 
“我是在尸狱里活了六年的人。”
“我杀过的怪物，比你见过的活人多万倍。”
“你骗得了孤独，骗得了善良。”
“你骗不了从地狱爬出来的人。”
 
她崩溃嘶吼，抓起碎片扑来。
 
我侧身避开，刀背抵住她脖颈。
 
这一刻，她终于彻底崩溃哭了，变回最初柔弱模样：
“我错了！我只是想活下去！末世本来就是这样！你放过我！”
 
我静静看着她。
 
没有恨，没有怒。
 
只剩无尽荒芜的悲凉。
 
我轻声道：
“你不配说活下去。”
 
“我在尸潮里一次次死里逃生，是为了守住做人的底线。”
“你在活人堆里勾心斗角，是为了吃掉同类活下去。”
 
“丧尸蚀人肉身。”
“你们蚀人骨髓。”
 
刀光落下。
 
一切终结。
 
终章 世间最寒是人心
 
安全屋恢复死寂。
 
满地活人尸体。
 
窗外，亿万丧尸依旧漫无目的地游荡、嘶吼、徘徊。
 
它们永远无知、永远凶残、永远无脑。
 
但这一刻。
 
我突然无比释然。
 
我宁愿被千万丧尸围杀一辈子。
也再也不愿遇见一个活人。
 
丧尸杀身。
 
活人诛心。
 
我擦净猎刀上的人血，背上破旧背包，推开安全屋大门。
 
灰雾扑面，冷风彻骨。
 
整片废土空城，依旧只有我一个活人的心跳。
 
从此。
 
我不再孤独。
 
因为我彻底明白——
 
真正的孤独，不是无人相伴。
是见过人性之后，再也不敢信任任何人。
 
我转身，走入漫天死寂的灰雾之中。
 
继续我的逃亡。
 
继续我的独活。
 
在这全域尸狱里。
 
唯我一人。
 
干净、冷漠、无牵、无挂。
`} ,
{ title: "残念", images: ["https://imgbed.heliar.top/i/sPpfhPoxWoft0zEg_%E6%88%AA%E5%B1%8F%202026-11-19%2016.14.07.png",
"https://imgbed.heliar.top/i/HbEDLuYKkX6nn8Gu_%E6%88%AA%E5%B1%8F%202026-11-19%2016.14.45.png",
"https://imgbed.heliar.top/i/lLNMNJeM8XQNYq3V_%E6%88%AA%E5%B1%8F%202026-11-19%2019.39.39.png",
"https://imgbed.heliar.top/i/i0psZnW2hbvITYRh_%E6%88%AA%E5%B1%8F%202026-11-19%2019.40.05.png",
"https://imgbed.heliar.top/i/TLDmS2qb9sem9MV4_%E6%88%AA%E5%B1%8F%202026-11-19%2019.40.33.png",
"https://imgbed.heliar.top/i/LySU8dJWEbr5Xgm3_%E6%88%AA%E5%B1%8F%202026-11-19%2019.41.00.png"], content: `灰雾沉降，暮色浸透崩塌的城区。
腐烂的腥气无孔不入，漫过断壁残垣，遥远的枪声早已成为旧时代的幻影，天地间只剩下丧尸此起彼伏、空洞浑浊的嗬嗬喉音。
 
我蜷缩在废弃便利店的货架后方，后背抵着冰冷锈蚀的铁皮，怀里攥着半块发硬开裂的压缩饼干，死死屏住呼吸。
 
拖沓、沉重的脚步声，一下，又一下，隔着蒙满灰尘的玻璃缓缓挪近。
 
来了。
 
我抬眼望去。
 
那是一具女丧尸，和街上疯狂扑杀活物的行尸截然不同。
她行动迟缓佝偻，身上那件米白色针织衫沾满发黑的血渍尘土，手指僵硬蜷缩，掌心始终小心翼翼向上虚托，仿佛捧着一件一碰就碎的珍宝。
对我身上鲜活的人气温热，她浑然不觉，只是漫无目的地在废墟之间来回打转，循环往复走着同一条路线。
 
若换做往日逃亡，我会压低身形，悄无声息绕开这片区域，绝不浪费半分体力。
可我的目光，被她脖颈间的物件钉住。一条褪色严重的儿童项链，小小的兔子吊坠，在灰暗光线下微微晃动。
 
逃亡途中，我曾在残存的营地废墟里翻到过老人留下的日记碎片。
 
灾变降临的那个凌晨，这位母亲正陪着五岁的女儿待在家中。
丧尸撞破房门的刹那，她拼尽全力把女儿推进衣柜，用自己的身体死死抵住门板。
獠牙刺入皮肉的瞬间，她死死捂住嘴巴，不肯发出一丝声响，怕惊吓到柜子里的孩子。
 
病毒吞噬了她全部理智、记忆与痛感，将她化为行尸。
但镌刻进骨血里的本能，没有被磨灭。
 
她遗忘了自己的身份，遗忘了家的方位，遗忘了恐惧与痛苦。
心底仅剩的执念亘古不变——找到她的小姑娘，护住她的孩子。
 
日复一日，她沿着从前接女儿放学的老路徘徊游荡。
路过垮塌的糖果店，便僵硬驻足，灰白空洞的眼球望向早已粉碎的橱窗；地上掉落的粉色发绳，会让她笨拙地弯腰，指甲刮磨着水泥地面，费力将发绳紧紧攥在掌心。
 
几天前，我搜索这片废墟的时候，在变形的衣柜残骸之中，见到过那具小小的遗骸，孩童的怀里，还死死抱着一只破旧的兔子玩偶。
 
暮色愈发浓重，灰雾开始翻涌，夜晚狂暴的尸潮快要降临。
 
女丧尸蹒跚走到衣柜的废墟原址，缓缓俯下身子，喉咙滚出一阵模糊沙哑的嗬嗬声，像是低声哄慰孩童的呢喃。
她僵硬的手臂伸出去，想要拉开那扇早已碎裂的柜门。
 
我站在数米之外，手中钢管握得指节泛白。只要挥下去，就能终结一具行尸，可沉重的铁器，怎么都无法向下落下。
 
晚风卷起漫天尘土，一片枯黄落叶悠悠飘落，轻轻落在她的手背上。
 
女丧尸骤然顿住，歪了歪腐烂的头颅，好似感知到某种熟悉的东西。
枯冷僵硬的胳膊缓缓抬起，做出一个无比笨拙的动作——那是母亲无数次抚摸孩子头顶的姿态。
 
眼前空空荡荡。
 
没有孩童的笑颜，没有稚嫩的应答。什么都没有。
 
她永远等不到自己的女儿。
 
片刻之后，她直起佝偻的脊背，拖着残破沉重的躯体，再度踏上那条没有终点的归途。拖沓空洞的脚步声，一点点消失在暮色笼罩的废墟深处。
那根捡来的粉色发绳，被枯朽的手指，攥得牢不可破。
 
哐当一声。
 
钢管从我手中滑落，砸在满地碎石之上。
刺耳的声响在空旷街区炸开，远处街巷，无数丧尸的嗬嗬声瞬间应声而起。
 
我后背一阵发凉，迅速弯腰捡起武器。
 
而这份片刻的动容，不能停留太久。
灰雾渐浓，黑夜将至，整片城市的尸群已经被声响惊动。
 
我不能沉溺情绪，只能继续逃亡。
 
丧尸没有思念，没有悲伤。
可母爱，逃过了病毒。
`} ]

沈清寒亲手，将淬毒寒刃刺入了谢临渊的胸膛。
 
世人都说，红衣刺客少主与温润镇北侯，正邪殊途，生死为敌。
只有沈清寒心知肚明。
这五年刀光剑影，从不是厮杀。
是她藏在刀刃里，不敢外露的深情。
 
无人知晓。
他们早在年少相识。
 
幼时巷陌相伴，岁岁朝夕。
谢临渊从垂髫之年，便心悦她一人。
小小少年，满心满眼，全是那个活泼明媚的小丫头。
 
奈何世事无常。
沈家逢难，满门倾覆。
年幼的沈清寒被带入刺客楼，从此堕入黑暗，不见天光。
而谢临渊困于侯府权锁，年少无力。
一场变故，生生拆散两小无猜。
一别数年，杳无音信。
 
他念了她整整十余年。
 
五年前春山桃林。
不是初遇，是他踏遍山河，蓄意奔赴的重逢。
 
彼时她重伤濒死，被师门追杀，倒在漫山芳菲里。
是谢临渊救下她。
为保她一命，他硬生生替她挡下刺客楼阴寒奇毒。
 
毒入经脉，无解无医。
平日蛰伏不露，一旦气血大乱、身受重创，便会瞬间反噬，摧骨蚀魂。
 
他瞒了所有人。
瞒了五年。
更瞒了沈清寒。
 
他怕她愧疚，怕她不安。
便一人扛下所有病痛，所有隐忍。
 
五年光阴，物是人非。
她成了冷血无情、身不由己的刺客。
他成了权倾朝野、镇守北疆的侯爷。
 
昔日青梅竹马，沦为正邪死敌。
 
无数个雨夜对峙，兵刃相撞，寒光炸裂夜色。
招招凌厉，招招留手。
她假意凶狠，他暗自退让。
 
眼底缱绻汹涌，却被身份、宿命、立场，死死困住。
 
温柔藏锋，深情藏刃。
相爱，只能相杀。
 
这一日，终局降临。
 
刺客楼大殿阴冷刺骨。
师尊将淬毒寒刃拍在石案，声音冰冷决绝。
 
“三日之内，取谢临渊性命。”
“违命，楼中千余死士，尽数陪葬。”
 
千条人命压身。
沈清寒无路可退。
 
她握着冰冷刃身，指尖发颤，心如刀割。
她要亲手杀死，世间唯一待她温柔之人。
 
秋夜皓月，庭院萧瑟。
红衣翻飞，寒刃冷光彻骨。
沈清寒踏入空寂侯府。
 
院中无护卫，无侍从。
谢临渊一身月白锦袍，孤身立在月色下。
安静等她来。
 
他眼底无惊无惧，只剩经年温柔。
“清寒，你来了。”
 
沈清寒喉间哽咽，强忍泪意，语气狠绝。
“奉命取你首级，今日，不死不休。”
 
利刃出鞘。
步步穿心。
 
谢临渊不闪不避，迎面而上。
 
锋刃刺破锦衣，深深没入胸膛。
猩红血色瞬间漫开，染透一片纯白。
 
就在入刃刹那。
 
蛰伏五年的剧毒，轰然爆发。
 
白霜爬满眉眼脖颈。
他满头乌黑青丝，寸寸霜白。
 
一瞬白头。
 
五年噬骨寒痛，五年隐忍深情。
尽数毁在她这一刀里。
 
沈清寒浑身剧震，泪水轰然砸落。
所有伪装的冷硬，瞬间崩塌殆尽。
 “你为什么不躲……”

谢临渊气息渐弱，抬手，温柔拭去她的泪。
声音轻得像风，字字成全。
 
“我若逃，你必死。”
“以我一命，换你余生安稳。”
“清寒，遇见你，我此生无憾。”
 
话音落。
眸中光亮寂灭。
身躯重重倒落血泊之中。
她跪地拥住渐渐冰冷的他，崩溃颤抖。
 
 一年后。
 
沈清寒独居空院，日夜相思，夜夜煎熬。
她始终以为，是自己的刺杀，终结了他性命。
 
直到她拆开那枚他常年贴身佩戴的白玉簪。
 
一张泛黄信纸，轻轻飘落。
 
字字剜心。
 
【年少初见，一念倾心，岁岁难忘。
山河万里寻你，春山重逢蓄意。
替你承毒五载，日夜噬痛，未曾一语。
我早陷皇权构陷，必死无疑。
宁死于你手，护你清白安稳。
此生不负天下，唯负自身。
若有来生，弃侯府荣华，舍权位功名。
只做寻常布衣，与你春山相守，岁岁无别，不负风月，不负卿。】
 
原来。
刀剑相让，是他纵容。
常年畏寒，是剧毒缠身。
坦然赴死，是他早已想好的结局。
 
他从年少爱她，寻她十载，护她五载。
默默扛下所有黑暗，所有病痛，所有宿命。
 
而她，亲手葬送了最爱她的人。
 
霜刃一出，误了风月，误了年少，误了余生。
 
从此。
风月年年在。
山河岁岁空。
世间再无谢临渊，等她一场春山归逢。

青砖爬满枯藤，木窗朽烂漏风，整栋楼终年不见日光，是当地人代代避讳的凶地。
 
老辈人口口相传：楼里困着一位绣花女鬼，名唤阿绣。
 
百年前，阿绣是整座城池最温婉手巧的女子。自幼浸于针线丹青，一生独爱绣牡丹。旁人绣花都求圆满盛放、富贵无双，唯独阿绣偏爱留白残花。
 
她心性柔软纯善，待世人皆温良，眉眼永远带着浅浅温顺，从未与人结怨。
 
年少时，她偶遇清贫书生，一见倾心，私定终身。
 
书生寒窗苦读，一朝赴京赶考，许诺她金榜归来，十里红妆，娶她为妻。
 
阿绣信了。
 
这一等，便是整整三年。
 
三年寒来暑往，她闭门居于绣楼，日夜不眠，亲手为自己缝制嫁衣、绣制婚鞋。她一针一线，细细描摹残缺牡丹，每一朵花都留着空白缺口。
 
旁人不解，问她缘由。
 
阿绣温柔浅笑，轻声道：“花残留白，并非缺憾，是留一寸圆满，待良人归来补全。”
 
嫁衣绣成，红鞋缝毕，婚期已定，喜帖遍发。
 
整座小城都等着这场圆满喜事，阿绣日日立于绣楼窗前，望穿秋水，静待归人。
 
可等来的，不是迎亲花轿，而是一场诛心噩耗。
 
书生京城高中，金榜题名，一朝翻身得高官厚禄。为攀附权贵、平步青云，他转头背弃旧约，迎娶当朝权贵之女，将三年相守、一生承诺，弃如敝履。
 
婚期前夜，喜讯碎成彻骨寒冰。
 
阿绣未哭未闹，只是静静穿着满身红妆，坐在空荡的绣楼里，一夜无言。
 
可宗族族人，最是重脸面、惧丑闻。
 
为掩盖书生负心、世家蒙羞的丑事，为保全宗族名声，他们颠倒黑白、捏造妄言，对外大肆散播：阿绣命格不祥、身缠鬼魅、克夫败运，是她妖邪缠身，不配婚嫁。
 
一纸污名，锁住了她的余生。
 
大婚当夜，满城张灯结彩、锣鼓喧天，家家户户喜庆满堂。
 
唯独这座绣楼，成了囚牢地狱。
 
族人狠心封死绣楼所有门窗，钉死木门、糊死窗纸、断绝所有粮草水源，将身着大红嫁衣、脚踩绣花红鞋的阿绣，活活困死在了孤楼之中。
 
无人施救，无人问津，无人听闻她的哀求。
 
漫漫长夜，红烛高燃，喜字鲜红刺眼，满身嫁衣灼灼似血。
 
整座城的热闹，衬得绣楼死寂阴森。
 
绝境之中，阿绣从未恨负心书生，从未怨凉薄世人，从未咒无情宗族。
 
她至死，心性依旧温柔纯粹。
 
弥留之际，枯坐空楼、濒临饿死冻死的最后一刻，她一遍又一遍，低低呢喃着同一句话，声音微弱空灵，绕楼不散：
 
“我鞋绣好了，你怎么还不来？”
 
一声，又一声，直至气息断绝。
 
她含冤而死，却依旧心存期许，无半分恶念。
 
可世人从未放过一个可怜人。
 
阿绣死后，宗族为彻底掩去罪孽、固化流言，刻意编造诡事、立下伪规，将她彻底污名化为索命厉鬼。

百年来，世人惧她、骂她、避她、厌她，代代相传她是害人恶鬼，用尽流言与偏见，死死镇压着她一缕残魂。
 
可无人知晓，这百年阴森诡谲的绣楼，从来没有害人厉鬼。
 
夜半三更，荒楼里悠悠响起的细碎脚步声，从不是索命寻仇。

深夜楼宇间飘忽的针线簌簌声，从不是鬼魅作祟。
 
是她至死未灭的执念，百年不散，依旧在默默绣着未完成的圆满，等着一句迟来的归期。
 
世人惧怕的缠人红鞋、近身阴气，从来不是索命害人。
 
只是她被困孤楼百年，岁岁年年孤身一人，太寂寥、太孤苦、太渴望一丝人间暖意。
 
她缠人、近人、留人，从无恶意，只是单纯想有人看一看她，陪一陪这困了百年的孤魂，终结她无尽的等待。
 
世人见她阴森可怖，殊不知，整座绣楼的百年阴风、夜半异响、诡异死寂，
 
从来不是恶鬼作祟。
 
只是一个温柔善良的姑娘，被负、被弃、被污、被锁、被冤死之后，
 
无人听闻、无人共情、无人救赎的，百年泣血哭声。
 
她从未害过人，
 
可这人间，
 
生生害了她百年。

一桩旧事
身为灵魂往生者
这个故事里我依旧在人间之外、不入轮回。
静静俯瞰人间一对深陷时空闭环的恋人。
 
男生叫陆时衍，清冷寡言、温柔偏执，是天生的时空守序者，身负逆转光阴的禁忌命格。
女生叫温予眠，温柔干净、明媚柔软，是被时空漏洞裹挟、注定早逝的宿命之人。
 
他们的命运，从相遇那一刻就写好了悲剧。
 
温予眠的命格天生残缺，每一条时间线里，她都会在二十二岁的深秋，死于一场无解的意外车祸，无药可解、无人可救，是天道定死的终局。
 
陆时衍第一次亲眼看着她离世的那一刻，崩溃失控，触碰了世间禁忌——逆转时空。
 
他透支自己的生命、撕碎时间长河，一次次回溯过往，修改所有结局。
每一条轮回里，他拼尽全力护她周全，挡下车祸、避开灾祸、抹平意外。
 
而温予眠，在无数次时空重叠中，隐约残存零碎的熟悉感。
她不知道自己轮回了多少次，却本能地深爱这个一次次救她于死地的少年。
她也偷偷学会了逆转时空，想替他承担代价，想换他一世安稳。
 
双向扭转时空，双向以命护爱，两人在无数次时间闭环里，彼此救赎、彼此消耗，熬碎了岁岁年年。

反复的时空篡改，让时空规则彻底崩坏，两人的命格死死绑定，只能活一人。
 
无数次轮回试探后，陆时衍终于找到了唯一的破局之法。
 
最后一次时空回溯，他没有再躲避灾祸，没有再改写意外。
深秋的十字路口，车流呼啸，灯火清冷。
他在车祸来临的瞬间，毫不犹豫，将温予眠死死护在怀里。

    const card = document.createElement('div');
    card.className = 'series-card';
    card.style.animationDelay = (i * 0.05) + 's';
    const div = document.createElement('div'); div.className = 'circle';
    const img = document.createElement('img'); img.src = series.cover;
    div.appendChild(img); 
    const label = document.createElement('div'); label.className = 'series-name'; label.textContent = series.name;
    card.appendChild(div); card.appendChild(label);
    card.addEventListener('click', () => { currentSeriesIndex = i; renderSeries(i); showView(seriesView); });
    seriesWrap.appendChild(card);
  });
  showView(homeView);
}

function renderSeries(seriesIdx) {
  const series = seriesData[seriesIdx]; storyListWrap.innerHTML = '';
  series.stories.forEach((story, i) => {
    const item = document.createElement('div'); item.className = 'story-item'; item.style.animationDelay = (i * 0.1) + 's';
    item.textContent = story.title; item.addEventListener('click', () => openStory(seriesIdx, i));
    storyListWrap.appendChild(item);
  });
}

function openStory(seriesIdx, storyIdx) {
  currentSeriesIndex = seriesIdx; currentStoryIndex = storyIdx;
  imgIndex = 0;
  
  renderStoryText();
  renderImages();
  startTimer();
  showView(readerView);
  scrollableContent.scrollTop = 0; // 重置滚动条
  updateButtons();
}

function renderStoryText() {
  const story = getStory();
  titleEl.textContent = story.title; 
  textEl.innerHTML = story.content || ''; 

  clearInterval(noteTimer);
  if (story.authorNote && story.authorNote.length > 0) {
    authorNoteContainer.innerHTML = `<div class="author-note-box"><span class="author-note-text" id="authorNoteText">${story.authorNote[0]}</span></div>`;
    noteIndex = 0;
    if (story.authorNote.length > 1) {
      noteTimer = setInterval(() => {
        const textBox = document.getElementById('authorNoteText');
        if (textBox) {
          textBox.style.opacity = 0;
          setTimeout(() => {
            noteIndex = (noteIndex + 1) % story.authorNote.length;
            textBox.textContent = story.authorNote[noteIndex];
            textBox.style.opacity = 1;
          }, 600);
        }
      }, 4000);
    }
  } else {
    authorNoteContainer.innerHTML = '';
  }
}

function getStory() { return seriesData[currentSeriesIndex].stories[currentStoryIndex]; }

function renderImages() {
  const images = getStory().images;
  carousel.querySelectorAll('img').forEach(img => img.remove()); dotsBox.innerHTML = ''; imgIndex = 0;
  if (!images || images.length === 0) { dotsBox.style.display = 'none'; return; }
  images.forEach((src, i) => {
    const img = document.createElement('img'); img.src = src;
    if (i === 0) img.classList.add('active');
    carousel.appendChild(img);
    const dot = document.createElement('span'); if (i === 0) dot.classList.add('on');
    dot.addEventListener('click', () => { goImage(i); resetTimer(); });
    dotsBox.appendChild(dot);
  });
  dotsBox.style.display = images.length > 1 ? 'flex' : 'none';
}

function goImage(i) {
  const imgs = carousel.querySelectorAll('img'); const dots = dotsBox.querySelectorAll('span');
  if (imgs.length === 0) return;
  imgIndex = (i + imgs.length) % imgs.length;
  imgs.forEach((img, idx) => img.classList.toggle('active', idx === imgIndex));
  dots.forEach((d, idx) => d.classList.toggle('on', idx === imgIndex));
}

function startTimer() { clearInterval(timer); const imgs = carousel.querySelectorAll('img'); if (imgs.length > 1) timer = setInterval(() => goImage(imgIndex + 1), 5000); }
function resetTimer() { startTimer(); }

function updateButtons() {
  const isFirst = (currentSeriesIndex === 0 && currentStoryIndex === 0);
  prevBtn.disabled = isFirst;
  // 下一页永远不禁用，用弹窗提示
  nextBtn.disabled = false;
}

/* 核心切换故事逻辑 */
function goNextStory() {
  if (flipping) return;
  const nextStoryIdx = currentStoryIndex + 1;
  if (nextStoryIdx < seriesData[currentSeriesIndex].stories.length) {
    flipToStory(currentSeriesIndex, nextStoryIdx, false);
  } else {
    const nextSeriesIdx = currentSeriesIndex + 1;
    if (nextSeriesIdx < seriesData.length) {
      flipToStory(nextSeriesIdx, 0, false);
    } else {
      showModal('已无更多内容');
    }
  }
}

function goPrevStory() {
  if (flipping) return;
  const prevStoryIdx = currentStoryIndex - 1;
  if (prevStoryIdx >= 0) {
    flipToStory(currentSeriesIndex, prevStoryIdx, true);
  } else {
    const prevSeriesIdx = currentSeriesIndex - 1;
    if (prevSeriesIdx >= 0) {
      const lastStoryIdx = seriesData[prevSeriesIdx].stories.length - 1;
      flipToStory(prevSeriesIdx, lastStoryIdx, true);
    }
  }
}

/* 3D 翻书动画执行 */
function flipToStory(sIdx, stIdx, reverse) {
  flipping = true;
  clearInterval(timer); clearInterval(noteTimer);

  if (isMobile()) {
    // 手机端用淡入淡出切换
    const contentBox = document.querySelector('.page-right .content');
    contentBox.classList.remove('anim-next', 'anim-prev');
    void contentBox.offsetWidth; // 触发重绘
    contentBox.classList.add(reverse ? 'anim-prev' : 'anim-next');
    
    setTimeout(() => {
      currentSeriesIndex = sIdx; currentStoryIndex = stIdx;
      renderStoryText();
      renderImages();
      startTimer();
      scrollableContent.scrollTop = 0;
      updateButtons();
      setTimeout(() => { flipping = false; }, 400);
    }, 200);

  } else {
    // 电脑端 3D 翻书
    const flip = document.createElement('div'); flip.className = 'flip-page'; flip.textContent = reverse ? '←' : '→';
    bookEl.appendChild(flip); void flip.offsetWidth;
    
    if (!reverse) { flip.classList.add('forward'); } else {
      flip.style.transition = 'none'; flip.style.transform = 'rotateY(-180deg)'; void flip.offsetWidth;
      flip.style.transition = 'transform .8s ease-in-out'; flip.style.transform = 'rotateY(0deg)';
    }
    
    setTimeout(() => {
      currentSeriesIndex = sIdx; currentStoryIndex = stIdx;
      renderStoryText();
      renderImages();
      startTimer();
      scrollableContent.scrollTop = 0;
      updateButtons();
    }, 400);
    
    setTimeout(() => { flip.remove(); flipping = false; }, 850);
  }
}

function showModal(msg) { modalText.textContent = msg; modalMask.classList.add('show'); }
modalOk.addEventListener('click', () => { modalMask.classList.remove('show'); renderSeries(currentSeriesIndex); showView(seriesView); });

backBtn.addEventListener('click', () => {
  clearInterval(timer); clearInterval(noteTimer);
  if (!readerView.classList.contains('hidden')) { renderSeries(currentSeriesIndex); showView(seriesView); }
  else if (!seriesView.classList.contains('hidden')) { showView(homeView); }
});

prevBtn.addEventListener('click', goPrevStory);
nextBtn.addEventListener('click', goNextStory);

// 键盘快捷键
document.addEventListener('keydown', (e) => { 
  if (readerView.classList.contains('hidden')) return; 
  if (e.key === 'ArrowLeft') goPrevStory(); 
  if (e.key === 'ArrowRight') goNextStory(); 
});

// 手机端滑动切换
let touchStartX = 0, touchStartY = 0;
document.body.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
document.body.addEventListener('touchend', (e) => {
  if (!readerView.classList.contains('hidden')) {
    const dx = e.changedTouches[0].clientX - touchStartX; const dy = e.changedTouches[0].clientY - touchStartY;
    // 只有当滑动距离够长，且横向大于纵向才触发
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { 
      if (dx < 0) goNextStory(); else goPrevStory(); 
    }
  }
}, { passive: true });

renderHome();
</script>
</body>
</html>
